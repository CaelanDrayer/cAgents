name: CI

# Runs the cAgents quality gate automatically on push and PR so the
# "CI-green at HEAD" tiny-bump criterion (.claude/rules/core/version-registry.md)
# is enforced by an automated pipeline, not just by contributors running the
# scripts locally. Closes audit finding A1-F2 (team_plugin-prod-audit_260716_001).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 makes HEAD~1 available so the tiny-bump guard can
          # compare the new version (HEAD) against the previous (HEAD~1).
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run cAgents quality gate
        run: bash scripts/ci/cagents-ci.sh
