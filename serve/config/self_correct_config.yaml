# Self-correct config for SERVE super-domain
# Inherits shared coordination failure patterns from base config
_base: shared/config/base_self_correct_config.yaml

super_domain: serve
description: Self-correction patterns for SERVE super-domain

execution_failures:
- failure: Task incomplete
  recovery: Identify blocking issue and resolve
- failure: SLA breach risk
  recovery: Escalate immediately, allocate additional resources
- failure: Legal review incomplete
  recovery: Engage additional legal specialists, extend review

validation_failures:
- failure: Quality gate failed
  recovery: Address specific failure and re-validate
- failure: Customer satisfaction below target
  recovery: Analyze feedback, implement targeted improvements
- failure: Compliance gap identified
  recovery: Document gap, implement remediation plan
