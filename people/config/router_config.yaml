super_domain: people
description: Routing configuration for PEOPLE super-domain
tier_classification:
  # NOTE: tier_0 and tier_1 are deprecated - all requests auto-upgrade to tier_2 minimum
  tier_2:
    description: Moderate complexity, 1 controller
    time_estimate: 1-4 hours
    auto_upgrade_from: [tier_0, tier_1]
  tier_3:
    description: Complex, multiple controllers
    time_estimate: 4-12 hours
  tier_4:
    description: Expert-level, HITL required
    time_estimate: 1-3 days
keywords:
  - people
  - hire
  - recruit
  - HR
  - talent
  - culture
  - employee
  - onboard
  - benefits
  - compensation
  - performance
  - retention
complexity_indicators:
  tier_2:
    - "single HR process or policy"
    - "individual hiring request"
    - "clear role requirements"
  tier_3:
    - "multi-team hiring initiative"
    - "cross-functional culture programs"
    - "organizational development"
  tier_4:
    - "workforce transformation"
    - "organization-wide restructuring"
    - "executive talent decisions"
