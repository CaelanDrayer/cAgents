# People domain overrides
domain: people
description: "Human resources, talent acquisition, culture, and people operations"

planner:
  controller_catalog:
    tier_2: [hr-manager, hr-business-partner]
    tier_3: [hr-manager, talent-acquisition-manager, hr-business-partner]
    tier_4: [chro, hr-manager, talent-acquisition-manager]

  specialist_routing:
    recruiting:
      keywords: [recruit, hire, candidate, sourcing, interview, offer, talent pipeline, job posting]
      agents: [talent-acquisition-manager]
      description: "Recruiting and talent acquisition coordination"

