super_domain: people
description: Planning configuration for PEOPLE super-domain

# Shared questions defined once via YAML anchor. See .claude/rules/core/shared-questions.md
shared_questions: &people_questions
  - "What are the current team dynamics and gaps?"
  - "What are the cultural considerations?"
  - "What are the retention and engagement metrics?"

controller_catalog:
  tier_2:
    - name: hr-manager
      agent_path: operator/people-ops/hr-manager/SKILL.md
      coordination_style: question_based
      typical_questions:
        - "What are the current HR operations and process gaps?"
        - "What employee lifecycle stage needs attention?"
        - "What policy or compliance issues need resolution?"
      use_when:
        - "HR operations coordination needed"
        - "Employee lifecycle management"
        - "HR policy implementation"
        - "People team coordination"
      complexity: tier_2

    - name: hr-business-partner
      agent_path: operator/people-ops/hr-business-partner/SKILL.md
      coordination_style: question_based
      typical_questions: *people_questions
      use_when:
        - "Business unit HR support needed"
        - "Employee relations issues"
        - "Performance management questions"
        - "HR policy implementation"
      complexity: tier_2

  # Note: hr-ops-specialist is an execution agent (tier: execution in SKILL.md).
  # talent-acquisition-manager is a controller listed in domain_overrides.yaml.

  tier_3:
    - name: hr-manager
      agent_path: operator/people-ops/hr-manager/SKILL.md
      coordination_style: question_based
      typical_questions: *people_questions
      use_when:
        - "Complex HR operations coordination"
        - "Multi-team people management"
      complexity: tier_3

    - name: talent-acquisition-manager
      agent_path: people/agents/talent-acquisition-manager/SKILL.md
      coordination_style: question_based
      typical_questions: *people_questions
      use_when:
        - "Large-scale recruiting coordination"
        - "Talent pipeline strategy"
      complexity: tier_3

    - name: hr-business-partner
      agent_path: operator/people-ops/hr-business-partner/SKILL.md
      coordination_style: question_based
      typical_questions: *people_questions
      use_when:
        - "Business unit HR alignment"
        - "Organizational development"
      complexity: tier_3

  tier_4:
    - name: chro
      agent_path: leadership/chro/SKILL.md
      coordination_style: question_based
      typical_questions: *people_questions
      use_when:
        - "Strategic people vision needed"
        - "Workforce planning required"
        - "Organizational design decisions"
        - "Executive talent decisions"
        - "Major HR transformations"
      complexity: tier_4

# Templates for objective generation
objectives_templates:
  default:
    - "Implement {feature} in people domain"
    - "Analyze {data} for people operations"
    - "Create {deliverable} for people use case"

# Success criteria - references shared template
# See: cagents-memory/_system/templates/shared_success_criteria.yaml for full patterns
success_criteria_patterns:
  _shared: "@cagents-memory/_system/templates/shared_success_criteria.yaml"
  # Domain-specific additions for people super-domain
  people_specific:
    - "HR policies comply with employment regulations"
    - "Employee experience metrics considered"
    - "Culture alignment verified"
