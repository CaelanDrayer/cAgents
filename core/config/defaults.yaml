# Global config defaults for all domains
# Domain-specific overrides in {domain}/config/domain_overrides.yaml
version: "2.0"

router:
  default_tier: 2
  escalation_threshold: 0.65
  minimum_tier: 2

planner:
  default_controller_questions:
    - "What is the current implementation of this feature?"
    - "What are the technical constraints we need to consider?"
    - "What are the key risks and dependencies?"
  max_objectives: 10
  decomposition_threshold: 3

decomposer:
  min_work_items: 1
  max_work_items: 50
  require_acceptance_criteria: true
  require_agent_assignment: true
  require_dependency_graph: true

controller:
  max_questions: 20
  max_review_rounds: 3
  delegation_prompt_max_tokens: 300
  coordination_style: question_based

validator:
  pass_threshold: 0.8
  max_revision_cycles: 5
  evidence_required: true

executor:
  max_concurrent_agents: 50
  timeout_seconds: 300

pipeline:
  paths:
    minimal:
      threshold: 0.25
      states: [PLANNED, PROMPTS_READY, COORDINATED]
      skip_agents: [orchestrator, decomposer, prompt-engineer, validator]
    medium:
      threshold: 0.65
      states: [PLANNED, DECOMPOSED, PROMPTS_READY, COORDINATED, VALIDATED]
      skip_agents: [orchestrator, prompt-engineer]
    full:
      threshold: 1.0
      states: [INIT, ORCHESTRATED, PLANNED, DECOMPOSED, PROMPTS_READY, COORDINATED, VALIDATED]
      skip_agents: []

  revision:
    max_cycles: 5
    on_fail: PROMPTS_READY
    on_revise: PLANNED
    escalation: user_hitl

error_format:
  template: |
    [ERROR] {component}: {brief}

    What: {description}

    Why:  {root_cause}

    Fix:
      1. {step_1}
      2. {step_2}
      3. {fallback}

version_sync:
  source: package.json
  locations:
    - package.json
    - .claude-plugin/plugin.json
    - .claude-plugin/marketplace.json
    - CLAUDE.md
    - engineering/.claude-plugin/plugin.json
    - creative/.claude-plugin/plugin.json
    - business/.claude-plugin/plugin.json
    - growth/.claude-plugin/plugin.json
    - people/.claude-plugin/plugin.json
    - service/.claude-plugin/plugin.json
    - core/.claude-plugin/plugin.json
    - leadership/.claude-plugin/plugin.json
    - shared/.claude-plugin/plugin.json
    - .claude/settings.json
