# Cross-File Analysis Patterns for /optimize
# V8.0: Enhanced detection through file relationship analysis
#
# These patterns detect optimization opportunities that span multiple files,
# improving detection accuracy by 15-25% for systemic issues.

version: "1.0.0"
description: "Cross-file analysis patterns for detecting multi-file optimization opportunities"

# =============================================================================
# DEPENDENCY GRAPH ANALYSIS
# =============================================================================
# Analyzes import/export relationships to detect structural issues

dependency_analysis:
  enabled: true

  patterns:
    circular_dependency:
      description: "Files that import each other creating cycles"
      impact: "Bundle size, tree-shaking failure, memory issues"
      severity: high
      confidence_boost: 0.2
      detection:
        algorithm: "tarjan_scc"  # Strongly connected components
        min_cycle_size: 2
        max_cycle_size: 10
      examples:
        - "A imports B, B imports A"
        - "A -> B -> C -> A (3-way cycle)"
      solutions:
        - "Extract shared types to separate module"
        - "Use dependency injection"
        - "Restructure module boundaries"
        - "Create interface modules"

    deep_import_chain:
      description: "Long import chains indicating poor organization"
      impact: "Build time, cold start, maintainability"
      severity: medium
      confidence_boost: 0.15
      detection:
        threshold: 5  # imports deep before flagging
        max_depth: 10  # stop searching after this
      examples:
        - "page.tsx -> layout.tsx -> utils.ts -> helpers.ts -> constants.ts -> types.ts"
      solutions:
        - "Flatten with barrel exports"
        - "Use code splitting"
        - "Restructure to reduce depth"
        - "Create facade modules"

    unused_exports:
      description: "Exported symbols never imported elsewhere in project"
      impact: "Bundle size, code clarity, dead code"
      severity: low
      confidence_boost: 0.1
      detection:
        scan_patterns:
          - "export (const|function|class|type|interface)"
          - "export default"
          - "export { .* }"
        exclude_patterns:
          - "*.d.ts"  # Type declaration files
          - "index.ts"  # Barrel exports
          - "*.test.*"  # Test files
      solutions:
        - "Remove unused exports"
        - "Mark as internal with underscore prefix"
        - "Add eslint rule for unused exports"

    high_fan_out:
      description: "File imports from too many other files (high coupling)"
      impact: "Maintainability, testing difficulty, change amplification"
      severity: medium
      confidence_boost: 0.15
      detection:
        threshold: 15  # imports before flagging
        critical_threshold: 25
      examples:
        - "Component importing from 20+ different modules"
      solutions:
        - "Split into smaller focused modules"
        - "Use composition patterns"
        - "Create abstraction layers"
        - "Use dependency injection"

    high_fan_in:
      description: "File imported by too many other files (hub file)"
      impact: "Change risk, bottleneck, potential for breaking changes"
      severity: medium
      confidence_boost: 0.1
      detection:
        threshold: 20  # importers before flagging
        critical_threshold: 40
      solutions:
        - "Consider stability - hub files should change rarely"
        - "Add comprehensive tests for hub files"
        - "Consider splitting into smaller units"
        - "Define clear public API"

# =============================================================================
# DATA FLOW ANALYSIS
# =============================================================================
# Tracks data transformations and state across files

data_flow_analysis:
  enabled: true

  patterns:
    prop_drilling:
      description: "Props passed through multiple intermediate components without use"
      impact: "Code complexity, re-render cascades, maintainability"
      severity: medium
      confidence_boost: 0.15
      detection:
        threshold: 4  # levels deep before flagging
        frameworks: ["react", "vue", "svelte"]
        indicators:
          - "Prop received and passed unchanged"
          - "Destructured prop immediately spread to child"
      solutions:
        - "React Context API"
        - "State management (Redux, Zustand, Jotai)"
        - "Component composition (render props, children)"
        - "Custom hooks for shared state"

    redundant_fetch:
      description: "Same API endpoint called from multiple unrelated locations"
      impact: "Network overhead, inconsistent data, UX latency"
      severity: high
      confidence_boost: 0.2
      detection:
        patterns:
          - "fetch\\(['\"]([^'\"]+)['\"]\\)"
          - "axios\\.(get|post|put|delete)\\(['\"]([^'\"]+)['\"]\\)"
          - "useQuery\\(['\"]([^'\"]+)['\"]"
        min_occurrences: 3  # Same endpoint called from 3+ places
      solutions:
        - "Centralize in API layer"
        - "Add caching (React Query, SWR, Apollo)"
        - "Use request deduplication"
        - "Implement data prefetching"

    state_duplication:
      description: "Same state maintained in multiple locations"
      impact: "Sync issues, bugs, memory overhead"
      severity: high
      confidence_boost: 0.2
      detection:
        indicators:
          - "Multiple useState with same initial value"
          - "Duplicate state shape definitions"
          - "Manual sync between state sources"
      solutions:
        - "Single source of truth"
        - "Derived state instead of duplicated"
        - "State lifting to common ancestor"
        - "Global state management"

    transformation_chain:
      description: "Same data transformed multiple times across files"
      impact: "Performance, memory, debugging difficulty"
      severity: medium
      confidence_boost: 0.15
      detection:
        indicators:
          - "map().map() chains"
          - "Multiple JSON.parse/stringify"
          - "Repeated normalization logic"
      solutions:
        - "Transform once at data boundary"
        - "Use memoization"
        - "Create data normalization layer"
        - "Use selectors for derived data"

# =============================================================================
# ARCHITECTURAL PATTERN DETECTION
# =============================================================================
# Identifies cross-file architectural issues

architectural_analysis:
  enabled: true

  patterns:
    feature_duplication:
      description: "Similar code blocks implementing same logic across different files"
      impact: "Maintainability, bug duplication, bundle size"
      severity: high
      confidence_boost: 0.25
      detection:
        similarity_threshold: 0.7  # 70% similar code
        min_lines: 10  # Minimum lines to consider
        algorithms:
          - "ast_similarity"  # AST-based comparison
          - "token_similarity"  # Token sequence comparison
          - "structural_hash"  # Structural hash comparison
      solutions:
        - "Extract shared utility function"
        - "Create shared hook (React)"
        - "Use inheritance or composition"
        - "Create shared module"

    inconsistent_patterns:
      description: "Different approaches for same type of problem across codebase"
      impact: "Developer experience, maintainability, onboarding"
      severity: medium
      confidence_boost: 0.1
      detection:
        patterns:
          - "Mixed async patterns (callbacks, promises, async/await)"
          - "Mixed state management (useState, Redux, context)"
          - "Mixed error handling (try/catch, .catch(), error boundaries)"
          - "Mixed styling (CSS modules, styled-components, inline)"
      solutions:
        - "Standardize on one approach"
        - "Create style guide"
        - "Add linting rules"
        - "Gradual migration plan"

    missing_abstraction:
      description: "Repeated code patterns that should be abstracted"
      impact: "DRY violation, maintainability, bug risk"
      severity: medium
      confidence_boost: 0.15
      detection:
        min_occurrences: 3  # Same pattern in 3+ files
        patterns:
          - "Repeated try/catch with same error handling"
          - "Repeated validation logic"
          - "Repeated data formatting"
          - "Repeated API call patterns"
      solutions:
        - "Create utility function"
        - "Create custom hook"
        - "Create decorator/HOC"
        - "Use aspect-oriented patterns"

    layering_violation:
      description: "Components directly accessing lower layers (DB, external APIs)"
      impact: "Testability, separation of concerns, refactoring difficulty"
      severity: high
      confidence_boost: 0.2
      detection:
        violations:
          - "UI component importing database client"
          - "Component directly calling external API without service layer"
          - "Business logic in presentation layer"
          - "Direct SQL in route handlers"
      solutions:
        - "Introduce service layer"
        - "Use repository pattern"
        - "Create data access layer"
        - "Implement clean architecture"

    god_module:
      description: "Module that does too many things"
      impact: "Single responsibility violation, testing difficulty"
      severity: high
      confidence_boost: 0.2
      detection:
        thresholds:
          max_exports: 30
          max_functions: 25
          max_lines: 500
          max_responsibilities: 5  # Detected via naming analysis
      solutions:
        - "Split by responsibility"
        - "Extract to smaller modules"
        - "Apply single responsibility principle"

# =============================================================================
# PERFORMANCE PROPAGATION ANALYSIS
# =============================================================================
# Understands how performance issues cascade through the codebase

performance_propagation:
  enabled: true

  patterns:
    waterfall_render:
      description: "Sequential data fetching in component tree (child waits for parent data)"
      impact: "Initial load time, perceived performance, UX"
      severity: high
      confidence_boost: 0.2
      detection:
        indicators:
          - "useEffect depends on parent prop to fetch"
          - "Conditional render waiting for data"
          - "Nested data dependencies"
        frameworks: ["react", "vue", "svelte"]
      solutions:
        - "Parallel data fetching"
        - "Data prefetching"
        - "Server components (Next.js)"
        - "Request hoisting"
        - "SWR/React Query with prefetch"

    bundle_impact:
      description: "Heavy dependency imported in frequently-used module"
      impact: "Initial bundle size, code splitting potential"
      severity: high
      confidence_boost: 0.15
      detection:
        heavy_dependencies:
          - "moment"
          - "lodash"
          - "chart.js"
          - "@mui/material"
          - "antd"
        threshold_kb: 50  # Dependencies over 50KB
      solutions:
        - "Dynamic import for heavy deps"
        - "Use lighter alternatives (date-fns, lodash-es)"
        - "Tree-shake unused parts"
        - "Code split by route"

    rerender_cascade:
      description: "State change triggers re-renders across many components"
      impact: "Runtime performance, UI jank"
      severity: medium
      confidence_boost: 0.15
      detection:
        indicators:
          - "Context at root with frequent updates"
          - "Redux state with many subscribers"
          - "Shared state updated frequently"
        frameworks: ["react"]
      solutions:
        - "Memoization (useMemo, useCallback, React.memo)"
        - "Split context by update frequency"
        - "Use selective subscriptions"
        - "Use immer for immutable updates"

    query_n_plus_one:
      description: "Related data fetched in loop instead of batch"
      impact: "Database/API load, response latency"
      severity: critical
      confidence_boost: 0.25
      detection:
        patterns:
          - "Loop containing await fetch"
          - "map() with async callback making requests"
          - "forEach with database query"
        min_iterations: 3
      solutions:
        - "Batch queries (WHERE IN)"
        - "Use DataLoader pattern"
        - "GraphQL batching"
        - "Promise.all for parallel"
        - "Eager loading in ORM"

    synchronous_io:
      description: "Synchronous I/O operations blocking event loop"
      impact: "Server throughput, response time"
      severity: critical
      confidence_boost: 0.2
      detection:
        patterns:
          - "fs.readFileSync"
          - "fs.writeFileSync"
          - "execSync"
          - "child_process.spawnSync"
        exclude_contexts:
          - "build scripts"
          - "CLI tools"
          - "initialization code"
      solutions:
        - "Use async variants"
        - "Use worker threads for CPU-bound"
        - "Stream large files"

# =============================================================================
# CROSS-FILE CONFIDENCE ADJUSTMENTS
# =============================================================================
# How cross-file analysis modifies single-file detection confidence

confidence_adjustments:
  # When multiple files have related issues
  correlated_issues:
    same_pattern_multiple_files:
      adjustment: +0.15
      description: "Same issue pattern found in related files"

    dependency_chain_issue:
      adjustment: +0.2
      description: "Issue propagates through import chain"

    architectural_pattern:
      adjustment: +0.25
      description: "Issue is part of larger architectural problem"

  # When issue affects critical paths
  impact_multipliers:
    affects_entrypoint:
      multiplier: 1.5
      description: "Issue in entry point file"

    affects_hub_file:
      multiplier: 1.3
      description: "Issue in high-import-count file"

    affects_many_routes:
      multiplier: 1.4
      description: "Issue affects multiple routes/pages"

# =============================================================================
# OUTPUT FORMAT EXTENSIONS
# =============================================================================
# Additional fields for cross-file opportunities

opportunity_extensions:
  fields:
    related_files:
      type: "array"
      description: "List of all files involved in this opportunity"

    cross_file_type:
      type: "string"
      enum: ["dependency", "data_flow", "architectural", "performance"]
      description: "Category of cross-file issue"

    propagation_impact:
      type: "object"
      properties:
        affected_files_count: "number"
        affected_routes: "array"
        cascade_depth: "number"
      description: "How the issue spreads through codebase"

    consolidated_fix:
      type: "object"
      properties:
        description: "string"
        files_to_modify: "array"
        estimated_impact: "string"
      description: "Single fix addressing issues across multiple files"

# =============================================================================
# LANGUAGE-SPECIFIC CONFIGURATIONS
# =============================================================================

language_specific:
  javascript:
    import_patterns:
      - "import .* from ['\"](.+)['\"]"
      - "require\\(['\"](.+)['\"]\\)"
      - "import\\(['\"](.+)['\"]\\)"
    export_patterns:
      - "export (const|let|var|function|class|type|interface)"
      - "export default"
      - "export \\{"
      - "module.exports"

  typescript:
    import_patterns:
      - "import .* from ['\"](.+)['\"]"
      - "import type .* from ['\"](.+)['\"]"
    export_patterns:
      - "export (const|let|var|function|class|type|interface)"
      - "export default"
      - "export \\{"

  python:
    import_patterns:
      - "^import (.+)$"
      - "^from (.+) import"
    export_patterns:
      - "__all__ = \\[(.+)\\]"

  go:
    import_patterns:
      - "import \\("
      - "import \"(.+)\""
    export_patterns:
      - "^func [A-Z]"  # Capitalized = exported
      - "^type [A-Z]"
      - "^var [A-Z]"
      - "^const [A-Z]"

# =============================================================================
# ANALYSIS WORKFLOW
# =============================================================================

analysis_workflow:
  order:
    1: "scan_files"
    2: "build_dependency_graph"
    3: "analyze_graph_properties"
    4: "detect_data_flows"
    5: "identify_architectural_patterns"
    6: "analyze_performance_propagation"
    7: "correlate_with_single_file_findings"
    8: "generate_consolidated_opportunities"

  outputs:
    - "cross_file_analysis.yaml"
    - "dependency_graph.json"
    - "consolidated_opportunities.yaml"
