# Consolidated routing config (v12.0.0)
#
# This file replaces the 11 legacy domain dirs deleted in WI-W4.2:
#   engineering/, creative/, business/, growth/, service/,
#   science/, health/, education/, personal/, arts/, trades/
#
# Per cagents-memory/sessions/run_full-plugin-revamp-plan_260520_001/outputs/revamp-design-v2.md
# § 6a: "11 of 13 legacy dirs deletable after consolidation. 2 (`people/`, `shared/`)
# survive."
#
# The router consults this file's `router.<domain>.keywords` to score domain match.
# The planner consults `planner.<domain>.controller_catalog` and
# `planner.<domain>.specialist_routing` for tier-based controller selection and
# specialist agent delegation.
#
# people/ and shared/ keep their own config/domain_overrides.yaml (they're more
# active and ship with additional config). The 2 archetype-roots core/ and
# leadership/ also keep their own config files.
#
# Schema is the union of the deleted files' fields, namespaced by domain.

schema_version: "1"
generated_by: "v12 W4.2 consolidation"

