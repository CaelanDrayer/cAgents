# Growth domain overrides
domain: growth
description: "Marketing execution, sales operations, demand generation"

planner:
  controller_catalog:
    tier_2: [campaign-manager, creative-director, product-marketing-manager]
    tier_3: [campaign-manager, marketing-strategist, sales-strategist, creative-director, product-marketing-manager]
    tier_4: [cmo, cro, marketing-strategist]

  specialist_routing:
    sales:
      keywords: [sales, quota, territory, pipeline, deal, close, prospect, SDR, account executive]
      agents: [sales-strategist]
      description: "Sales strategy and operations"
    content:
      keywords: [content, creative, brand, copy, copywriting, social media]
      agents: [creative-director]
      description: "Content and creative marketing"
    product_marketing:
      keywords: [positioning, messaging, launch, go-to-market, competitive, GTM]
      agents: [product-marketing-manager]
      description: "Product marketing and launches"
    seo:
      keywords: [SEO, search engine, organic, keyword research, ranking, backlink]
      agents: [seo-specialist]
      description: "Search engine optimization"
    social_media:
      keywords: [social media, Instagram, LinkedIn, Twitter, TikTok, community, social]
      agents: [social-media-manager]
      description: "Social media management (cross-domain: community-manager in service/)"
    public_relations:
      keywords: [PR, press release, media, journalist, thought leadership, publicity]
      agents: [pr-specialist]
      description: "Public relations and media outreach"
