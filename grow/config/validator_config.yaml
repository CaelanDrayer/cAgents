# Validator config for GROW super-domain
# Inherits shared quality gates from base config
_base: shared/config/base_validator_config.yaml

super_domain: grow
description: Validation rules for GROW super-domain

regression_checks:
- No breaking changes to existing campaigns
- Brand guidelines compliance maintained
- No negative impact on existing conversion funnels

domain_specific_checks:
- Campaign metrics meet or exceed targets
- Sales enablement content approved by stakeholders
- Marketing assets align with brand guidelines
- Target audience properly defined and validated
