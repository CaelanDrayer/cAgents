# Self-correct config for GROW super-domain
# Inherits shared coordination failure patterns from base config
_base: shared/config/base_self_correct_config.yaml

super_domain: grow
description: Self-correction patterns for GROW super-domain

execution_failures:
- failure: Task incomplete
  recovery: Identify blocking issue and resolve
- failure: Content misses target audience
  recovery: Re-analyze audience, revise messaging
- failure: Campaign metrics below threshold
  recovery: Adjust targeting, creative, or channel mix

validation_failures:
- failure: Quality gate failed
  recovery: Address specific failure and re-validate
- failure: Brand guidelines violated
  recovery: Review brand standards, revise assets
- failure: Conversion funnel degraded
  recovery: A/B test alternatives, restore baseline
