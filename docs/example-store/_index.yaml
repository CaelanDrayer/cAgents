# Example Store Index
# Machine-readable catalog for planner few-shot selection.
# Filter by `category` + `applies_to`, then @path-load the top 1-3 matching `path`s.
# Mirrors cagents-memory/_system/templates/teams/_index.yaml shape.

schema_version: "1"
catalog_version: "1.2"

categories:
  - review
  - verification
  - minimalism
  - skill-authoring
  - intake
  - gates
  - strategy
  - structured-io
  - security

# Audited-through record, one row for each source repo of the store.
# baseline_sha: the upstream commit that the example bodies were distilled from.
# It is the same value as metadata.source_commit in each ex-*.md file of the repo.
# last_audited_sha: the newest upstream commit that a security audit cleared.
# The next review reads the upstream range from last_audited_sha to the new HEAD.
# A repo advances only when its audit verdict is CLEAN. Any other verdict keeps
# last_audited_sha at the baseline, and report points to the audit result.
source_repos:
  - {repo: NousResearch/hermes-agent, baseline_sha: ca069e12239a2c8d13887ac9f983557d00bdcfd2, last_audited_sha: ca069e12239a2c8d13887ac9f983557d00bdcfd2, last_audited: "2026-10-15", verdict: SUSPICIOUS, report: "See the audit report of session act_streamline-cleanup-plugin_261111_001 (local session data, not in git)."}
