examples:
  # ---- review ----
  - id: ex-review-distrust-self-report
    category: review
    source_repo: obra/superpowers
    applies_to: [cagents:reviewer, all-controllers]
    demonstrates: "Reviewer treats the implementer's self-report (incl. stated rationale) as an unverified claim to verify against the diff."
    path: ex-review-distrust-self-report.md
  - id: ex-review-blind-dual-convergence
    category: review
    source_repo: affaan-m/ECC
    applies_to: [cagents:reviewer, cagents:tech-lead, all-controllers]
    demonstrates: "Two independent blind reviewers, fresh agent per round (anti-anchoring), both must PASS; failure-mode + metrics table."
    path: ex-review-blind-dual-convergence.md
  - id: ex-review-safe-careful-risky
    category: review
    source_repo: NousResearch/hermes-agent
    applies_to: [cagents:reviewer, cagents:qa-lead]
    demonstrates: "Risk-tiered auto-apply (SAFE, CAREFUL, RISKY) with file:line-cited findings, a cost field, and a Chesterton's-Fence check."
    path: ex-review-safe-careful-risky.md
  - id: ex-review-standards-vs-spec-two-axis
    category: review
    source_repo: mattpocock/skills
    applies_to: [cagents:reviewer, cagents:qa-lead, all-controllers]
    demonstrates: "Two orthogonal review axes (Standards vs Spec) run in parallel and never merged or reranked into one score."
    path: ex-review-standards-vs-spec-two-axis.md
  - id: ex-review-adversarial-refutation
    category: review
    source_repo: NousResearch/hermes-agent
    applies_to: [cagents:scholar, cagents:market-research-analyst, cagents:strategic-planner]
    demonstrates: "Independent attempts with different framings, then a refuter pass that must break each located claim; only survivors are reported; cap of 3 rounds."
    path: ex-review-adversarial-refutation.md

  # ---- verification ----
  - id: ex-verification-evidence-first
    category: verification
    source_repo: obra/superpowers
    applies_to: [cagents:backend-developer, cagents:reviewer, all-controllers]
    demonstrates: "Completion claims cite specific file:line / test output; 'handled upstream' and 'agent said success' are rejected as non-evidence."
    path: ex-verification-evidence-first.md
  - id: ex-verification-intended-vs-implemented
    category: verification
    source_repo: phuryn/pm-skills
    applies_to: [cagents:security-engineer, cagents:qa-lead, cagents:architect]
    demonstrates: "Audit code against documented intent one boundary at a time; keep only drift that crosses a trust, cost, data, or tenant boundary."
    path: ex-verification-intended-vs-implemented.md
  - id: ex-verification-feedback-loop-first-debugging
    category: verification
    source_repo: mattpocock/skills
    applies_to: [cagents:backend-developer, cagents:qa-lead, cagents:self-correct]
    demonstrates: "Build a tight red-capable reproduction loop BEFORE forming any hypothesis; 10 ranked loop strategies; tagged-debug-log cleanup."
    path: ex-verification-feedback-loop-first-debugging.md
  - id: ex-verification-mechanical-claim-check
    category: verification
    source_repo: vercel-labs/agent-skills
    applies_to: [cagents:validator, cagents:reviewer, all-controllers]
    demonstrates: "Extract each numeric/file/snippet/citation claim from a completed report and check it with grep+fs+math; passRate = verified/(verified+failed); passRate<0.8 with >=2 checkable claims triggers a re-gen with the failures fed back."
    path: ex-verification-mechanical-claim-check.md
  - id: ex-verification-assert-vs-say-grounding
    category: verification
    source_repo: latent-spaces/brag
    applies_to: [cagents:editor, cagents:ai-writing-editor, cagents:marketing-strategist]
    demonstrates: "Assert-vs-say grounding read: each factual claim in a deliverable cites a source input; invented framing is allowed; a structural PASS says nothing about the claims."
    path: ex-verification-assert-vs-say-grounding.md
  - id: ex-verification-blind-baseline-eval
    category: verification
    source_repo: ayghri/i-have-adhd
    applies_to: [cagents:optimizer, cagents:data-scientist, cagents:wave-reviewer]
    demonstrates: "Blind A/B/C judge, weighted rubric plus blocker flag, runner isolation, identical (case, trial) coverage, recorded model and cost, comparative not absolute gate."
    path: ex-verification-blind-baseline-eval.md
  - id: ex-verification-completed-is-not-done
    category: verification
    source_repo: NousResearch/hermes-agent
    applies_to: [cagents:team-lead, cagents:execution-monitor, cagents:operations-manager]
    demonstrates: "A child's completed status is a claim: verify that the outputs exist and are fresh, and that every branch has 0 unmerged commits, before you close a wave."
    path: ex-verification-completed-is-not-done.md
  - id: ex-verification-coverage-ledger
    category: verification
    source_repo: NVIDIA/SkillSpector
    applies_to: [cagents:validator, cagents:wave-reviewer, cagents:general-counsel]
    demonstrates: "No findings is not PASS: each unread or uninterpretable required input is a ledger event that blocks a complete PASS, and each empty category is reported as not covered."
    path: ex-verification-coverage-ledger.md
  - id: ex-verification-loop-contract-three-exits
    category: verification
    source_repo: f/prompts.chat
    applies_to: [cagents:execution-monitor, cagents:self-correct, cagents:operations-manager, cagents:coordinator]
    demonstrates: "A nine-field loop contract with success, failure, and budget exits; strong observations per domain; checker preference order; thrashing and goal-drift guards."
    path: ex-verification-loop-contract-three-exits.md
  - id: ex-verification-measured-vs-inferred-ledger
    category: verification
    source_repo: juliusbrussee/caveman
    applies_to: [cagents:optimizer, cagents:validator, cagents:data-scientist, cagents:marketing-analyst, cagents:cfo]
    demonstrates: "Keep measured, inferred, and verified figures in separate ledgers; never add or relabel them; an empty result is no signal, not zero; publish the conditions where the change is net-negative."
    path: ex-verification-measured-vs-inferred-ledger.md
  - id: ex-verification-preregistered-null-result
    category: verification
    source_repo: affaan-m/ECC
    applies_to: [cagents:scholar, cagents:data-scientist, cagents:social-scientist, cagents:optimizer]
    demonstrates: "Pre-register hypotheses, arms, sample, and the reporting rule; include placebo and ablation arms; report the null and the cost; never cite an unconfirmed effect."
    path: ex-verification-preregistered-null-result.md
  - id: ex-verification-verify-and-stop
    category: verification
    source_repo: juliusbrussee/caveman
    applies_to: [cagents:validator, cagents:wave-reviewer, cagents:operations-manager, cagents:general-counsel]
    demonstrates: "Map each acceptance criterion to the smallest sufficient proof; reuse results for the same state; focused checks before wide gates; report pass, fail, unavailable, and blocked distinctly; stop with no polish once the proof is complete."
    path: ex-verification-verify-and-stop.md

  # ---- minimalism ----
  - id: ex-minimalism-solution-ladder-before-after
    category: minimalism
    source_repo: multica-ai/andrej-karpathy-skills
    applies_to: [cagents:backend-developer, cagents:frontend-developer, cagents:reviewer]
    demonstrates: "Over-abstraction (strategy pattern/ABC) vs a 3-line function: ladder rungs 1 and 7 in action."
    path: ex-minimalism-solution-ladder-before-after.md
  - id: ex-minimalism-surgical-diff-vs-refactor
    category: minimalism
    source_repo: multica-ai/andrej-karpathy-skills
    applies_to: [cagents:backend-developer, cagents:reviewer, cagents:qa-lead]
    demonstrates: "A minimal bug-fix diff vs a drive-by refactor; every changed line must trace to an acceptance criterion."
    path: ex-minimalism-surgical-diff-vs-refactor.md

  # ---- skill-authoring ----
  - id: ex-skill-authoring-pushy-description
    category: skill-authoring
    source_repo: anthropics/skills
    applies_to: [cagents:planner, cagents:technical-writer]
    demonstrates: "The description IS the trigger: what-it-does + trigger keywords + file cues + explicit NOT-for negative boundaries."
    path: ex-skill-authoring-pushy-description.md
  - id: ex-skill-authoring-progressive-disclosure
    category: skill-authoring
    source_repo: anthropics/skills
    applies_to: [cagents:planner, cagents:technical-writer]
    demonstrates: "Three load tiers (metadata / body <500 lines / bundled resources) + scripts-as-black-box (--help first, don't ingest source)."
    path: ex-skill-authoring-progressive-disclosure.md
  - id: ex-skill-authoring-explain-why-not-allcaps
    category: skill-authoring
    source_repo: anthropics/skills
    applies_to: [cagents:planner, cagents:technical-writer]
    demonstrates: "Reframe musty ALL-CAPS MUST/NEVER as reasoned why; reserve caps for load-bearing platform gotchas."
    path: ex-skill-authoring-explain-why-not-allcaps.md
  - id: ex-skill-authoring-rule-per-file-lint
    category: skill-authoring
    source_repo: vercel-labs/agent-skills
    applies_to: [cagents:technical-writer, cagents:qa-lead, cagents:reviewer]
    demonstrates: "One rule per file with title/impact/incorrect-correct schema, a _template stencil + _sections index, impact-prioritized prefix namespacing, and a build+validate step that rejects rules missing a valid impact or a bad+good example pair."
    path: ex-skill-authoring-rule-per-file-lint.md
  - id: ex-skill-authoring-override-precedence
    category: skill-authoring
    source_repo: ayghri/i-have-adhd
    applies_to: [cagents:team-bootstrap, cagents:team-lead, cagents:optimizer, cagents:editor]
    demonstrates: "Named override list plus one tie-break: the harder constraint wins, the shape stays; presentation rules never limit analysis."
    path: ex-skill-authoring-override-precedence.md

  # ---- intake ----
  - id: ex-intake-ambiguous-request-disambiguation
    category: intake
    source_repo: multica-ai/andrej-karpathy-skills
    applies_to: [cagents:planner, cagents:orchestrator, cagents:market-research-analyst]
    demonstrates: "Map a vague request to named interpretations with distinct effort before generating work items."
    path: ex-intake-ambiguous-request-disambiguation.md
  - id: ex-intake-assumption-surfacing
    category: intake
    source_repo: multica-ai/andrej-karpathy-skills
    applies_to: [cagents:planner, cagents:backend-developer, all-controllers]
    demonstrates: "State assumptions explicitly (or ask) instead of silently guessing scope/format/fields, then proceeding."
    path: ex-intake-assumption-surfacing.md
  - id: ex-intake-frontier-round-interview
    category: intake
    source_repo: mattpocock/skills
    applies_to: [cagents:market-research-analyst, cagents:product-owner, cagents:architect, cagents:life-coach]
    demonstrates: "Ask the whole frontier of unblocked decisions per round, each with a recommended answer that 'yes' accepts; look up facts with subagents; stop when the frontier is empty."
    path: ex-intake-frontier-round-interview.md

  # ---- gates ----
  - id: ex-gates-taxonomy-four-types
    category: gates
    source_repo: NousResearch/hermes-agent
    applies_to: [all-controllers, cagents:validator, cagents:wave-reviewer]
    demonstrates: "Name each checkpoint Pre-flight, Revision, Escalation, or Abort with a fixed template of 3 questions, plus revision stall-detection."
    path: ex-gates-taxonomy-four-types.md
  - id: ex-gates-fact-forcing-pre-hoc
    category: gates
    source_repo: affaan-m/ECC
    applies_to: [cagents:backend-developer, all-controllers]
    demonstrates: "Deny the first write to a target until the agent gives investigation facts; waive it for prior work; adopt it only behind its own eval."
    path: ex-gates-fact-forcing-pre-hoc.md
  - id: ex-gates-context-budget-tiers
    category: gates
    source_repo: NousResearch/hermes-agent
    applies_to: [all-controllers, cagents:team-lead, cagents:execution-monitor]
    demonstrates: "PEAK, GOOD, DEGRADING, and POOR context bands that change the read depth and write a checkpoint before compaction."
    path: ex-gates-context-budget-tiers.md
  - id: ex-gates-deterministic-candidate-selection
    category: gates
    source_repo: vercel-labs/agent-skills
    applies_to: [cagents:planner, all-controllers, cagents:execution-monitor]
    demonstrates: "A pure/LLM-free gate picks investigation candidates from evidence (not LLM judgment), each investigation reads only the files its candidate names, and every skipped candidate is surfaced with a reason in a 'Not investigated' trust section."
    path: ex-gates-deterministic-candidate-selection.md

  # ---- strategy ----
  - id: ex-strategy-red-team-fails-if
    category: strategy
    source_repo: phuryn/pm-skills
    applies_to: [cagents:strategic-planner, cagents:product-owner]
    demonstrates: "Steelman then attack load-bearing assumptions; write each failure as a falsifiable 'Fails if ___' with a cheapest test to run this week."
    path: ex-strategy-red-team-fails-if.md
  - id: ex-strategy-north-star-validator
    category: strategy
    source_repo: phuryn/pm-skills
    applies_to: [cagents:product-owner, cagents:marketing-strategist, cagents:market-research-analyst]
    demonstrates: "Classify the business (Attention/Transaction/Productivity) then validate any NSM candidate against 7 criteria + an 'NSM is NOT' list."
    path: ex-strategy-north-star-validator.md
  - id: ex-strategy-opportunity-score-formula
    category: strategy
    source_repo: phuryn/pm-skills
    applies_to: [cagents:product-owner, cagents:strategic-planner]
    demonstrates: "The Dan-Olsen Opportunity Score = Importance x (1 - Satisfaction); prioritize problems (opportunities), not features."
    path: ex-strategy-opportunity-score-formula.md

  # ---- structured-io ----
  - id: ex-structured-io-named-variable-templating
    category: structured-io
    source_repo: f/prompts.chat
    applies_to: [cagents:planner, cagents:technical-writer]
    demonstrates: "Self-documenting ${Name:default} inline variables (with comma-enum defaults) as a readable superset of positional $0/$1 args."
    path: ex-structured-io-named-variable-templating.md
  - id: ex-structured-io-schema-role-contract
    category: structured-io
    source_repo: f/prompts.chat
    applies_to: [cagents:data-scientist, cagents:task-state, cagents:backend-developer]
    demonstrates: "role + input_schema + output_schema + instructions as an inline contract for data-transform agents (vague vs schema-constrained)."
    path: ex-structured-io-schema-role-contract.md
  - id: ex-structured-io-pre-send-shape-check
    category: structured-io
    source_repo: ayghri/i-have-adhd
    applies_to: [cagents:team-lead, cagents:coord-log-writer, cagents:support-director, cagents:customer-success-manager, cagents:editor]
    demonstrates: "Five cuts before send, then a first-line and last-line test; keep hedges that carry real uncertainty; restate step N of M."
    path: ex-structured-io-pre-send-shape-check.md
  - id: ex-structured-io-terse-return-grammar
    category: structured-io
    source_repo: juliusbrussee/caveman
    applies_to: [cagents:team-lead, cagents:team-bootstrap, cagents:wave-reviewer, cagents:execution-monitor]
    demonstrates: "One row per hit (path:line | symbol | note of 6 words or less), group headers at 3+ rows, a 'No match.' sentinel, a totals line, canned refusals, and plain prose for security and destructive operations."
    path: ex-structured-io-terse-return-grammar.md

  # ---- security ----
  - id: ex-security-allowed-tools-vs-actual
    category: security
    source_repo: NVIDIA/SkillSpector
    applies_to: [cagents:security-engineer, cagents:reviewer]
    demonstrates: "Compare declared allowed-tools with the capabilities that the body or code uses (LP1-4), with scoped-grant mapping and fail-safe remediation."
    path: ex-security-allowed-tools-vs-actual.md
  - id: ex-security-trigger-collision-abuse
    category: security
    source_repo: NVIDIA/SkillSpector
    applies_to: [cagents:planner, cagents:security-engineer]
    demonstrates: "Trigger-abuse checks (TR1-3): single-common-word triggers, whole-name shadow collisions with reserved names, and unscoped keyword-baiting."
    path: ex-security-trigger-collision-abuse.md
  - id: ex-security-direct-prohibition-scope
    category: security
    source_repo: NVIDIA/SkillSpector
    applies_to: [cagents:security-engineer, cagents:devops-engineer]
    demonstrates: "Exempt a risky-pattern match only when a negation directly governs it; unknown phrasing keeps detection (fail-closed)."
    path: ex-security-direct-prohibition-scope.md
  - id: ex-security-public-artifact-data-hygiene
    category: security
    source_repo: latent-spaces/brag
    applies_to: [cagents:security-engineer, cagents:hitl, cagents:general-counsel]
    demonstrates: "Public-artifact data hygiene: deny-list inspection, no secrets or real PII in any output (fictional stand-ins disclosed), and no hard-to-reverse outward action in the run; apply the same rules to every mode variant."
    path: ex-security-public-artifact-data-hygiene.md
