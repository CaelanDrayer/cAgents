# Arts domain overrides
domain: arts
description: "Visual arts, performing arts, music production, photography, and film"

planner:
  controller_catalog:
    tier_2: [generic-coordinator]
    tier_3: [generic-coordinator]
    tier_4: [generic-coordinator]

  specialist_routing:
    visual:
      keywords: [painting, sculpture, watercolor, oil painting, drawing, illustration, portfolio, exhibition, art history, gallery, visual art]
      agents: [visual-artist]
      description: "Visual art creation and critique"
    photography:
      keywords: [photography, photo, camera, lightroom, composition, portrait, landscape, studio, editing]
      agents: [photographer]
      description: "Photography technique, editing, and composition"
    film:
      keywords: [film, filmmaking, cinematography, directing, screenplay, video production, editing, shot composition, storyboard]
      agents: [film-director]
      description: "Film direction, cinematography, and video production"
    music_teaching:
      keywords: [music theory, ear training, sight reading, instrument, lesson, practice, scales, chords, music education]
      agents: [music-teacher]
      description: "Music education, theory, and instrument instruction"
    music_production:
      keywords: [music production, recording, mixing, mastering, DAW, studio, beats, arrangement, sound design, audio engineering]
      agents: [music-producer]
      description: "Music production, recording, and audio engineering"
    performing_arts:
      keywords: [dance, theater, performance, acting, stage, choreography, improv, musical theater]
      agents: [generic-coordinator]
      description: "Performing arts routed through generic-coordinator"

