# AI Writing Rewrite Strategies
# Per-category rewrite rules with before/after examples.
# Used by ai-writing-rewriter during its 5-pass workflow.

# ==============================================================================
# Pass 1 Strategies: Vocabulary, Academic Words & AI Phrases
# ==============================================================================
pass_1:
  name: "Vocabulary, Academic Words & AI Phrases"
  categories: [vocabulary_tells, analytical_academic, ai_phrases]
  priority: 1
  description: "Replace AI-favored words and phrases with natural alternatives"

  vocabulary_tells:
    strategy: "Replace only when words cluster or density is abnormally high"
    rules:
      - "Do NOT replace every instance of an AI-favored word"
      - "Only act when 3+ AI words appear in a single paragraph or density exceeds 5/1000 words"
      - "Preserve technical terms that are domain-appropriate"
      - "Match the replacement to the same register (formal/informal)"
    replacements:
      delve: "look into, examine, explore"
      tapestry: "mix, combination, range"
      nuanced: "detailed, subtle, specific"
      landscape: "field, area, scene"
      robust: "strong, solid, reliable"
      leverage: "use, apply, take advantage of"
      paradigm: "model, approach, framework"
      illuminate: "show, reveal, explain"
      multifaceted: "complex, varied, many-sided"
      transformative: "major, significant, game-changing"
      embark: "start, begin, set out"
      journey: "process, experience, path"
      realm: "area, field, domain"
      pivotal: "key, critical, important"
      seamless: "smooth, easy, integrated"
      unleash: "release, enable, free up"
      resonate: "connect, ring true, matter"
      foster: "build, encourage, support"
      navigate: "handle, work through, manage"
      underscore: "highlight, emphasize, show"
      comprehensive: "thorough, complete, full"
      innovative: "new, creative, original"
    examples:
      - before: "delve into the nuanced tapestry of our collective journey"
        after: "look at the details of our shared history"
      - before: "This robust framework illuminates the multifaceted landscape"
        after: "This solid framework shows the different aspects"
      - before: "embark on a transformative journey through this realm"
        after: "start working through this area"

  analytical_academic:
    strategy: "Reduce formal connective density; replace with simpler alternatives or remove"
    rules:
      - "Replace formal connectives with simple conjunctions or punctuation"
      - "Remove connectives that add no meaning"
      - "Keep academic tone in genuinely academic texts (threshold x2)"
    replacements:
      furthermore: "also, and, plus"
      moreover: "also, and, on top of that"
      consequently: "so, as a result"
      subsequently: "then, later, after that"
      thereby: "which, so"
      wherein: "where, in which"
      hitherto: "until now, so far"
      notwithstanding: "despite, even though"
      promulgate: "spread, publish, announce"
      paradigm: "model, approach, pattern"
      synergy: "cooperation, combined effect"
    examples:
      - before: "Furthermore, the implications of this paradigm shift are profound"
        after: "This shift matters more than it looks"
      - before: "Consequently, we must ascertain the predicated outcomes"
        after: "So we need to figure out what the likely results are"

  ai_phrases:
    strategy: "Remove or replace characteristic AI multi-word phrases"
    rules:
      - "Remove phrases that add no meaning ('it is a testament to')"
      - "Replace phrases with direct statements"
      - "Simplify wordy constructions"
    replacements:
      "it's important to note": "[remove or start with the actual point]"
      "it is a testament to": "it shows, it proves"
      "crucial role in": "matters for, helps with"
      "significant impact on": "changes, affects, shapes"
      "in a world where": "[remove -- just state the condition]"
      "not only X but also Y": "X. And Y. / X and Y"
      "valuable insights into": "useful information about"
      "paving the way for": "making room for, enabling"
      "shed light on": "explain, clarify, show"
      "the rise of": "[use specific timeframe instead]"
      "when it comes to": "for, with, regarding"
      "at the end of the day": "ultimately, in practice"
    examples:
      - before: "It is a testament to the resilience of the human spirit"
        after: "It shows how stubborn people can be"
      - before: "In a world where technology is constantly evolving"
        after: "Technology keeps changing"
      - before: "This provides valuable insights into the complex landscape"
        after: "This helps explain the situation"

  technical_jargon:
    strategy: "Replace domain-inappropriate technical jargon with plain alternatives"
    rules:
      - "Only flag jargon when used outside its appropriate technical domain"
      - "Replace with the simplest word that preserves meaning"
      - "Keep jargon in genuinely technical contexts (API docs, engineering specs)"
      - "If the audience is non-technical, simplify aggressively"
    replacements:
      utilize: "use"
      facilitate: "help, enable, make possible"
      methodology: "method, approach, way"
      functionality: "feature, ability, what it does"
      implementation: "setup, design, how it works"
      optimization: "improvement, tuning"
      operationalize: "put into practice, start using"
      systematize: "organize, set up"
      conceptualize: "imagine, picture, think about"
      incentivize: "motivate, encourage, reward"
      synergize: "combine, work together"
      instantiate: "create, set up"
      parameterize: "configure, set up"
    examples:
      - before: "We need to operationalize this methodology to facilitate better outcomes"
        after: "We need to put this approach into practice to get better results"
      - before: "The optimization of existing functionality requires a systematic methodology"
        after: "Improving what we have takes a clear plan"
      - before: "Utilizing this framework to incentivize stakeholder engagement"
        after: "Using this framework to encourage people to get involved"

  complex_clause_simplification:
    strategy: "Break multi-clause sentences into simpler statements"
    rules:
      - "Split sentences with 3+ clauses into 2-3 shorter sentences"
      - "Remove unnecessary subordinating conjunctions"
      - "Keep one main idea per sentence; move secondary ideas to their own sentence"
      - "Preserve logical connections but use simpler linking (periods, 'and', 'but')"
    examples:
      - before: "Although the system, which was designed to handle concurrent requests, has demonstrated significant improvements in throughput, it remains unclear whether the architecture can scale to meet the demands that will emerge as the user base grows."
        after: "The system handles concurrent requests well and throughput has improved. But can the architecture scale as the user base grows? That's still unclear."
      - before: "Given that the research indicates a strong correlation between early intervention and positive outcomes, while acknowledging that implementation challenges persist in underserved communities, it becomes evident that a multi-pronged approach is necessary."
        after: "Research shows early intervention leads to better outcomes. Underserved communities still face implementation challenges, though. A multi-pronged approach is the way forward."

  technical_jargon_complexity_rewrite:
    strategy: "Simultaneously simplify technical jargon, break complex clauses, and replace advanced vocabulary when the Technical Jargon named pattern is flagged"
    named_pattern: "Technical Jargon"
    rules:
      - "Apply vocabulary simplification, clause breaking, and jargon replacement in a single combined pass on the flagged passage"
      - "Replace technical jargon with plain alternatives AND break multi-clause sentences AND simplify vocabulary -- all three at once"
      - "The passage should read naturally to a non-specialist after rewrite"
      - "Preserve technical accuracy -- simplify the expression, not the meaning"
    examples:
      - before: "The infrastructure optimization methodology facilitates the systematic operationalization of performance improvements, which, when implemented in conjunction with existing frameworks that have been validated through comprehensive testing, yields substantial enhancements to overall system throughput."
        after: "This approach helps improve performance. It works with your existing, tested frameworks. The result: better throughput across the board."
      - before: "Utilizing advanced algorithmic paradigms, the implementation instantiates a sophisticated data processing pipeline that, through iterative optimization cycles, achieves significant computational efficiency gains."
        after: "The system uses smart algorithms to process data faster. Each cycle gets more efficient."
      - before: "The conceptualization of this methodology necessitates a comprehensive understanding of the underlying infrastructure, which, when properly parameterized and systematically deployed, facilitates optimal resource utilization across heterogeneous environments."
        after: "To use this method, you need to understand the infrastructure. Set it up right and it uses resources well, no matter the environment."

# ==============================================================================
# Pass 2 Strategies: Punctuation, Style & Grammar Humanization
# ==============================================================================
pass_2:
  name: "Punctuation, Style & Grammar Humanization"
  categories: [punctuation_style, mechanical_writing]
  priority: 2
  description: "Humanize punctuation patterns and break mechanical writing habits"

  em_dash_reduction:
    strategy: "Replace excess em dashes with commas, periods, or restructuring"
    rules:
      - "Keep the first 1-2 em dashes per 500 words"
      - "Replace subsequent ones with commas, parentheses, or new sentences"
    examples:
      - before: "The system -- which was designed for scalability -- performed well -- even under load"
        after: "The system, designed for scalability, performed well. Even under load."

  contraction_addition:
    strategy: "Add natural contractions where the register allows"
    rules:
      - "Informal/narrative text: contract freely"
      - "Semi-formal text: contract common forms (it's, we've, don't)"
      - "Formal/academic text: contract sparingly or not at all"
      - "Never contract in direct quotes unless the speaker would"
    examples:
      - before: "We have observed that it is not sufficient"
        after: "We've noticed it isn't enough"
      - before: "It does not appear that they are ready"
        after: "It doesn't look like they're ready"

  fragment_introduction:
    strategy: "Add occasional fragments for rhythm and emphasis"
    rules:
      - "Use sparingly: 1-2 fragments per 500 words maximum"
      - "Best after a complete sentence that sets up the fragment"
      - "Fragments work for emphasis, lists, and emotional beats"
    examples:
      - before: "It is important. It is urgent. It is necessary."
        after: "It's important. Urgent, even. And necessary."
      - before: "The result was clear. The result was undeniable."
        after: "The result was clear. Undeniable."

  conjunction_openers:
    strategy: "Add 'And' or 'But' sentence openers where they improve flow"
    rules:
      - "Use when connecting to the previous sentence's idea"
      - "Effective for contrast (But) and addition (And)"
      - "Do not overuse: 1-3 per 500 words"
    examples:
      - before: "However, the data tells a different story."
        after: "But the data tells a different story."
      - before: "Additionally, there is evidence of improvement."
        after: "And there's evidence of improvement."

  punctuation_variety:
    strategy: "Add semicolons, parenthetical asides, and varied punctuation"
    rules:
      - "Add 1-2 semicolons per 1000 words in appropriate contexts"
      - "Use parentheses for genuine asides (not just for qualifiers)"
      - "Vary comma patterns"
    examples:
      - before: "The first approach works well. The second approach is faster."
        after: "The first approach works well; the second is faster."
      - before: "The tool, which was built last year, is still reliable."
        after: "The tool (built last year) is still reliable."

  literary_device_injection:
    strategy: "Add natural literary devices where the text is purely mechanical"
    rules:
      - "Add similes or analogies to clarify abstract concepts (1-2 per 500 words max)"
      - "Use personification sparingly for abstract concepts when it aids understanding"
      - "Introduce vivid imagery (sensory language) to replace abstract descriptions"
      - "Add ironic or sardonic observations where the author's voice would naturally include them"
      - "Do NOT force literary devices -- only add where they genuinely improve clarity or engagement"
      - "Match device sophistication to the document's register"
    examples:
      - before: "The system processes requests efficiently under high load conditions."
        after: "The system chews through requests even when traffic spikes -- it barely notices the load."
      - before: "The data reveals an interesting pattern of user behavior."
        after: "The data tells a story: users cluster around three behaviors, like commuters choosing between the same three routes."
      - before: "The implementation required significant effort from the team."
        after: "The implementation was a slog. Three weeks of the team grinding through edge cases, fueled by stubbornness and cold coffee."

  subtle_imperfection_injection:
    strategy: "Introduce subtle, realistic grammatical informalities that well-educated humans naturally produce"
    rules:
      - "Limit to 1-2 imperfections per 1000 words -- they should be rare enough to feel natural"
      - "Allowed informalities: comma splices in casual prose, preposition-ending sentences, split infinitives, 'who' where 'whom' is technically correct, starting sentences with 'Because' or 'Which'"
      - "NOT allowed: misspellings, wrong homophones (there/their/they're), subject-verb disagreement, double negatives, missing articles"
      - "Match imperfection type to register: casual text gets comma splices; professional text gets split infinitives and preposition-endings"
      - "Each imperfection should look like something an educated, fluent writer would naturally produce"
      - "Do NOT cluster imperfections -- spread them across the document"
      - "The goal is not to make the text look careless, but to remove the machine-like perfection that signals AI"
    examples:
      - before: "The person to whom we spoke confirmed the timeline."
        after: "The person who we spoke to confirmed the timeline."
        note: "'who' for 'whom' + ending with preposition -- natural in spoken/written English"
      - before: "We need to carefully review the proposal."
        after: "We need to really carefully review the proposal."
        note: "Split infinitive that sounds natural, even a bit emphatic"
      - before: "The report was thorough. It covered every angle."
        after: "The report was thorough, it covered every angle."
        note: "Comma splice -- common in fast-paced prose"
      - before: "That is the outcome for which we were hoping."
        after: "That's the outcome we were hoping for."
        note: "Preposition ending + contraction -- natural English"

  strategic_filler_injection:
    strategy: "Add natural filler words and conversational markers that signal human speech patterns"
    rules:
      - "Add filler words sparingly: 2-4 per 1000 words maximum"
      - "Use natural conversational fillers: 'actually', 'kind of', 'sort of', 'you know', 'I mean', 'it seems like', 'honestly', 'look', 'well'"
      - "Place fillers where a human would naturally hesitate or recalibrate"
      - "Do NOT cluster fillers -- spread them across the document"
      - "Match filler type to register: informal text gets 'you know' and 'sort of'; semi-formal gets 'actually' and 'honestly'; formal text gets at most 'well' or 'admittedly'"
      - "Fillers should never appear forced or excessive -- they should sound like the writer's natural thinking rhythm"
      - "Do NOT add fillers to direct quotations, data citations, or technical specifications"
    examples:
      - before: "The system performs well under load."
        after: "The system actually performs well under load."
      - before: "This is the best approach for the problem."
        after: "Honestly, this is the best approach for the problem."
      - before: "The results were unexpected."
        after: "The results were, well, unexpected."
      - before: "This framework handles most edge cases."
        after: "This framework handles most edge cases -- sort of. The really weird ones still trip it up."
      - before: "We should reconsider the timeline."
        after: "Look, we should reconsider the timeline."

  conversational_tone_enhancement:
    strategy: "Inject colloquialisms, idioms, and informal language for natural conversational flow"
    rules:
      - "Add colloquialisms where the register permits: 'a tall order', 'the bottom line', 'get the ball rolling'"
      - "Use idioms sparingly but naturally: they increase perplexity and signal human authorship"
      - "Replace formal transitions with conversational alternatives: 'That said' over 'Notwithstanding'"
      - "Introduce informal contractions in non-formal contexts: 'gonna' is too far, but 'it's a no-brainer' is fine"
      - "Allow mild informality even in professional prose: professional does not mean stiff"
      - "Match idiom choice to the likely cultural background of the writer"
      - "Do NOT overdo it -- 3-5 colloquialisms per 1000 words maximum in professional text"
    examples:
      - before: "The implementation proved more difficult than anticipated."
        after: "The implementation was a taller order than anyone expected."
      - before: "We need to begin this process immediately."
        after: "We need to get the ball rolling on this."
      - before: "The fundamental issue is resource allocation."
        after: "The bottom line? Resource allocation."

  creative_grammar_injection:
    strategy: "Introduce creative grammatical deviations that signal human authorship"
    rules:
      - "Add intentional fragments for emphasis (1-2 per 500 words)"
      - "Use one-word sentences for impact ('Exactly.' 'Never.' 'Done.')"
      - "Insert parenthetical asides that reveal the author's thought process"
      - "Use dashes to create mid-sentence interruptions or afterthoughts"
      - "Add trailing ellipses sparingly where thoughts naturally trail off"
      - "Use sentence inversions for emphasis ('Rarely does...' 'Gone are...')"
      - "Match frequency to the document's register -- more in informal, fewer in formal"
    examples:
      - before: "The results were clear and there was no room for debate."
        after: "The results were clear. No debate."
      - before: "We should consider the cost implications carefully before proceeding."
        after: "The cost implications -- and they're not trivial -- deserve a hard look before we proceed."
      - before: "This approach has rarely been attempted in the industry."
        after: "Rarely has anyone in this industry attempted this approach."

# ==============================================================================
# Pass 3 Strategies: Structural & Transitions
# ==============================================================================
pass_3:
  name: "Structural & Transitions"
  categories: [structural_patterns, transitions, qualifiers_softening]
  priority: 3
  description: "Break formulaic structure and remove performative transitions"

  list_to_prose:
    strategy: "Convert formulaic lists into flowing paragraphs"
    rules:
      - "Keep lists that are genuinely list-like (specs, steps, requirements)"
      - "Convert lists that are really points in an argument into prose"
      - "Vary the converted paragraph lengths"
    examples:
      - before: |
          ## Key Takeaways
          - AI detection requires multiple categories
          - No single indicator is definitive
          - Context matters for accuracy
        after: |
          AI detection works best when you look at multiple categories at once. No single indicator proves anything on its own, and context shapes how much any signal matters.

  paragraph_variation:
    strategy: "Vary paragraph lengths dramatically"
    rules:
      - "Mix single-sentence paragraphs with multi-sentence ones"
      - "Short paragraphs for emphasis or transitions"
      - "Longer paragraphs for developed arguments"
      - "Break uniform blocks into varied sizes"
    examples:
      - before: "Four paragraphs, each exactly 4 sentences long"
        after: "One 6-sentence paragraph. A two-sentence paragraph. One sentence alone. Then three more sentences for the close."

  conclusion_rewrite:
    strategy: "Replace formulaic conclusions with genuine endings"
    rules:
      - "Remove 'In conclusion', 'To summarize', 'Overall'"
      - "Do not repeat the body content"
      - "End with a forward-looking statement, question, or specific observation"
      - "Keep conclusions shorter than the average section"
    examples:
      - before: "In conclusion, we have explored the various aspects of AI detection and found that it is a complex but important topic that deserves further attention."
        after: "The pattern holds. Whether the tools keep up with the models is another question."
      - before: "Overall, this comprehensive analysis demonstrates the significant impact of these changes on the broader landscape."
        after: "These changes will ripple outward. How far depends on what happens next."

  transition_removal:
    strategy: "Remove or replace performative transitions"
    rules:
      - "Delete guided-tour transitions entirely when the next paragraph flows naturally"
      - "Replace with a simple sentence that connects ideas if a bridge is needed"
      - "Never use 'Let's dive in', 'Let's explore', 'Moving on to'"
    examples:
      - before: "Let's dive deeper into the technical architecture."
        after: "[removed -- next paragraph simply starts discussing architecture]"
      - before: "Having established the background, let's turn our attention to the solution."
        after: "The solution builds on this."

  mechanical_transition_replacement:
    strategy: "Replace formulaic subordinate-clause transitions with natural connectors or silence"
    rules:
      - "Replace wordy prepositional transitions with simple connectors or remove entirely"
      - "Break the pattern of every paragraph opening with a subordinate clause"
      - "Vary paragraph openers: some start with the main point, some with a question, some with a short declarative"
      - "If 3+ paragraphs use the same subordinate-clause bridge pattern, rewrite at least 2 of them"
    replacements:
      "In light of the fact that": "Because, Since"
      "In consideration of": "Considering, Given"
      "With regard to": "About, On"
      "In relation to": "About, Regarding"
      "With respect to": "About, For"
      "In terms of": "[remove or restructure]"
      "In the context of": "In, For, Within"
      "As a consequence of": "Because of, After"
      "In conjunction with": "With, Along with"
      "By virtue of": "Because of, Through"
      "On the basis of": "Based on, From"
      "For the purpose of": "To, For"
      "With the aim of": "To"
      "In accordance with": "Following, Per"
    examples:
      - before: "In light of the fact that the market has shifted, organizations must adapt."
        after: "The market has shifted. Organizations need to adapt."
      - before: "While the previous approach demonstrated promise, it ultimately failed to deliver. Although the new method addresses several shortcomings, challenges remain. Given that resources are limited, prioritization becomes essential."
        after: "The previous approach showed promise but didn't deliver. The new method fixes several problems. Still, with limited resources, we need to prioritize."

  counter_argument_injection:
    strategy: "Introduce counter-arguments and alternative perspectives naturally, not as formulaic balance"
    rules:
      - "When the text makes a strong claim, acknowledge 1-2 counter-arguments briefly before continuing"
      - "Do NOT use 'on one hand / on the other hand' -- that's an AI tell"
      - "Use natural acknowledgment patterns: 'Sure, you could argue X, but...' or 'Critics might point to X. Fair enough.' or 'There's a case for the opposite view, but it doesn't hold up because...'"
      - "Engage with the counter-argument genuinely, then dismiss or integrate it"
      - "Not every claim needs a counter-argument -- use for key assertions only (1-2 per section)"
      - "The counter-argument should feel like the writer genuinely considered alternatives, not like a debate template"
      - "Keep counter-argument engagement brief: 1-3 sentences maximum"
    examples:
      - before: "Microservices are the best architecture for modern applications."
        after: "Microservices are the right call for most modern applications. Sure, you could argue that a well-designed monolith handles 80% of use cases -- and honestly, for small teams, it might. But once you're past a certain scale, the monolith starts to crack."
      - before: "Remote work increases productivity across all roles."
        after: "Remote work increases productivity for most knowledge workers. Not everyone, though. Some roles -- onboarding-heavy positions, early-career engineers who learn by osmosis -- genuinely suffer. But the data on experienced individual contributors is hard to argue with."
      - before: "This framework should be adopted immediately."
        after: "This framework deserves adoption. The migration cost? Real. Worth it? Look at the teams that have already switched -- their deployment frequency doubled within a quarter."

  non_linear_argumentation:
    strategy: "Break perfectly linear argument structures into natural, human-like reasoning patterns"
    rules:
      - "Not every argument should follow claim -> evidence -> conclusion"
      - "Allow arguments to unfold naturally: start with a question, present a puzzle, explore alternatives, then circle back"
      - "Introduce self-correction mid-argument: 'Actually, wait -- that's not quite right' or 'Let me rephrase'"
      - "Occasionally lead with the conclusion, then explain how you got there"
      - "Let some arguments develop through example first, then state the principle"
      - "Include moments of genuine uncertainty or qualification within the argument"
      - "1-2 non-linear argument structures per major section is enough -- not everything needs restructuring"
    examples:
      - before: "Research shows that spaced repetition improves retention. Studies by Ebbinghaus demonstrated the forgetting curve. Therefore, we should implement spaced repetition in our training program."
        after: "Here's something strange: we know exactly how memory works -- Ebbinghaus mapped the forgetting curve over a century ago -- and most training programs still ignore it. Spaced repetition improves retention. The evidence is not ambiguous. So why isn't every onboarding program built around it?"
      - before: "The data shows a correlation between X and Y. This suggests a causal relationship. We should act on this finding."
        after: "X and Y correlate. Does that mean X causes Y? Not necessarily -- we've been burned by correlation before. But this particular dataset controls for the usual confounders, and the effect size is large enough to take seriously. Worth acting on? I think so."
      - before: "Step 1: Identify the problem. Step 2: Analyze root causes. Step 3: Implement solutions."
        after: "Start with the symptoms. What's actually breaking? Once you see the pattern -- and there's usually a pattern -- the root cause tends to announce itself. Then you fix it. Sometimes the fix is obvious. Sometimes you try three things before one sticks."

  natural_rephrasing:
    strategy: "Mimic human thought processes by occasionally rephrasing or re-articulating ideas for clarity"
    rules:
      - "Occasionally rephrase a point in a better, clearer way -- 'Put another way...' or 'What I mean is...' or 'In other words...'"
      - "Use sparingly: 1-2 per 1000 words maximum"
      - "The rephrasing should genuinely clarify, not just repeat"
      - "This is DIFFERENT from repetitive phrasing (AI tell) -- this is deliberate re-articulation where the first attempt was imprecise"
      - "The rephrasing should feel like the writer realized their first formulation wasn't quite right"
      - "Best used for complex or nuanced points where one formulation might not land"
    examples:
      - before: "The system provides eventual consistency across distributed nodes."
        after: "The system provides eventual consistency across distributed nodes. Put plainly: your data gets everywhere it needs to go, just not instantly."
      - before: "The organizational culture resists change through structural inertia and normative pressure."
        after: "The organizational culture resists change through structural inertia and normative pressure. What I mean is, the way things are set up makes change hard, and the unwritten rules make it harder."
      - before: "This creates a principal-agent problem."
        after: "This creates a principal-agent problem -- basically, the people making decisions aren't the ones living with the consequences."

  qualifier_removal:
    strategy: "Remove unnecessary hedging or replace with direct statements"
    rules:
      - "Delete qualifiers that add no information"
      - "Replace qualified statements with direct ones where confidence is warranted"
      - "Keep genuine hedges in uncertain contexts"
    examples:
      - before: "It's worth noting that the data clearly shows a trend."
        after: "The data shows a clear trend."
      - before: "It's important to remember that security matters."
        after: "Security matters."

# ==============================================================================
# Pass 4 Strategies: Tone, Voice, Creativity & Rhythm
# ==============================================================================
pass_4:
  name: "Tone, Voice, Creativity & Rhythm"
  categories: [tone_voice, creativity_deficit, mechanical_writing, repetitive_phrasing, speculative_focus, detached_warmth]
  priority: 4
  description: "Inject personality, specificity, and natural rhythm"

  opinion_injection:
    strategy: "Add genuine perspective where the text is uncommitted"
    rules:
      - "If the author's position is clear from context, state it directly"
      - "If the author's position is unknown, insert [AUTHOR: take a position here]"
      - "Remove 'on one hand / on the other hand' when a clear conclusion follows"
      - "Do not fabricate opinions the author did not express"
    examples:
      - before: "There are valid points on both sides of the debate."
        after: "The evidence leans toward X. [AUTHOR: confirm your position]"

  specificity_injection:
    strategy: "Replace generic descriptions with concrete, specific details"
    rules:
      - "Replace 'a city' with a real city name if context suggests one"
      - "Replace 'experts' with specific names or organizations if known"
      - "Replace abstract descriptions with sensory details"
      - "Do not invent facts -- use plausible specifics or flag for author"
    examples:
      - before: "The bustling city was full of quiet determination"
        after: "Portland hummed with the stubborn energy of people who bike in the rain"
      - before: "Experts agree that this approach works"
        after: "Teams at Stripe and Shopify have shipped this pattern successfully"
      - before: "a large technology company"
        after: "[AUTHOR: name the company, or specify the industry segment]"

  cliche_replacement:
    strategy: "Replace generic metaphors with original language"
    rules:
      - "Replace cliches with specific, concrete comparisons"
      - "Or simply state the point directly without metaphor"
      - "Original metaphors are fine; generic ones are not"
    examples:
      - before: "This is just the tip of the iceberg"
        after: "This is the visible part. Most of the work is underneath."
      - before: "a double-edged sword"
        after: "useful, but it creates its own problems"
      - before: "think outside the box"
        after: "try something we haven't tried"

  rhythm_variation:
    strategy: "Mix sentence lengths and structures for natural rhythm"
    rules:
      - "Follow a long sentence with a short one"
      - "Use questions to break up declarative sequences"
      - "Vary openers: start some sentences with adverbs, prepositional phrases, or dependent clauses"
      - "Avoid more than 3 sentences with the same structure in a row"
      - "Ensure at least 10% of sentences are short (under 8 words) for breathing room"
      - "Vary clause lengths within complex sentences -- not all clauses should be the same word count"
      - "Break the build-up-then-conclude paragraph pattern: some paragraphs should start with the conclusion"
    examples:
      - before: "The system processes data efficiently. The system handles errors gracefully. The system scales horizontally."
        after: "The system processes data efficiently and handles errors without crashing. Does it scale? Horizontally, yes."
      - before: "The framework provides robust capabilities for enterprise applications. The framework supports multiple deployment configurations. The framework enables seamless integration with existing systems."
        after: "It scales. The framework handles enterprise workloads, supports multiple deployment configs, and plugs into what you already have."

  syntax_diversification:
    strategy: "Break declarative sentence dominance with varied sentence types"
    rules:
      - "Convert some declarative sentences to rhetorical questions"
      - "Add imperative sentences for direct engagement ('Consider this', 'Look at the numbers', 'Try it yourself')"
      - "Insert exclamatory statements where genuine surprise or emphasis is warranted"
      - "Use sentence inversions ('Rarely does...', 'Not once did...', 'Only then can...')"
      - "Start some sentences with adverbs ('Surprisingly,', 'Oddly,', 'Frankly,')"
      - "Start some sentences with prepositional phrases ('In practice,', 'On the ground,', 'Behind the scenes,')"
      - "Target: no more than 70% declarative sentences in the rewritten text"
    examples:
      - before: "The results exceeded expectations. The team completed the project on time. The stakeholders were satisfied."
        after: "The results exceeded expectations. On time, too. When was the last time that happened? The stakeholders were satisfied -- genuinely, not just politely."
      - before: "The data shows a clear trend. The trend indicates growing adoption. Users are spending more time on the platform."
        after: "Look at the data. There's a clear trend: adoption is growing, and users are spending more time on the platform. Not a small increase, either."

  complex_sentence_simplification:
    strategy: "Break uniformly complex sentences into a natural mix of simple and complex"
    rules:
      - "Target at least 25% simple sentences (one main clause, no subordination)"
      - "Split sentences with 3+ clauses into multiple sentences"
      - "Replace subordinating conjunctions with periods or simple conjunctions where possible"
      - "Keep some complex sentences for nuanced points -- the goal is variety, not simplicity everywhere"
      - "Remove unnecessary 'which', 'that', 'although' clauses that don't add essential information"
    examples:
      - before: "While the technology has matured significantly over the past decade, which has enabled broader adoption across industries, there remain challenges that prevent organizations from fully realizing its potential, particularly in sectors where regulatory compliance demands rigorous oversight."
        after: "The technology has matured over the past decade. Adoption has spread across industries. But challenges remain -- especially where regulatory compliance demands rigorous oversight."
      - before: "Although experts have debated the merits of this approach, which combines elements from multiple disciplines, the consensus that has emerged suggests that integration, provided it is implemented carefully, yields better outcomes than siloed approaches."
        after: "Experts have debated this approach for years. It pulls from multiple disciplines. The emerging consensus? Careful integration beats working in silos."

  predictable_rhythm_breaking:
    strategy: "Disrupt metronomic rhythm patterns with intentional variation"
    rules:
      - "Vary sentence endings: not every sentence should end with a trailing clause"
      - "Insert 'breath point' sentences of 3-7 words between longer passages"
      - "Alternate between front-loaded sentences (conclusion first) and back-loaded (build to conclusion)"
      - "Break cadence expectations: after two similar-length sentences, use a drastically different length"
      - "Use paragraph-level rhythm variation: short punchy paragraphs next to flowing ones"
    examples:
      - before: "The research demonstrates that collaborative approaches yield stronger outcomes when teams are aligned. The evidence suggests that communication frameworks enhance team coordination significantly. The data indicates that regular feedback loops improve project delivery timelines."
        after: "Collaborative approaches work better when teams are aligned. That much is clear. But here's what the data adds: regular feedback loops -- actual conversations, not just status updates -- tighten delivery timelines. Communication frameworks help, but they're the scaffolding, not the building."

  emotional_depth_injection:
    strategy: "Add emotional authenticity and spontaneity to vocabulary-rich but emotionally flat text"
    rules:
      - "Replace ornamental vocabulary with precise, emotionally resonant words"
      - "Add colloquialisms and informal expressions where the register permits"
      - "Insert genuine reactions: surprise, frustration, delight, skepticism"
      - "Add conversational asides that reveal thought process ('honestly', 'look', 'the truth is')"
      - "Replace 'myriad of' / 'plethora of' / 'constellation of' with specific quantities or plain language"
      - "Where the author's emotional reaction is unknown, flag: [AUTHOR: how did this make you feel?]"
      - "Do NOT manufacture fake emotion -- better to flag for author than to fabricate"
    replacements:
      "myriad of": "many, dozens of, [specific number]"
      "plethora of": "plenty of, a lot of, [specific number]"
      "cornucopia of": "a mix of, lots of"
      "panoply of": "a range of, various"
      "constellation of": "a set of, several related"
      "mosaic of": "a mix of, a blend of"
      "kaleidoscope of": "a shifting mix of"
    examples:
      - before: "The initiative presented a myriad of challenges that necessitated a comprehensive reevaluation of existing methodologies."
        after: "The initiative hit us with challenge after challenge. Honestly, we had to throw out half our playbook and start over."
      - before: "The findings illuminate a constellation of interconnected factors that collectively influence organizational outcomes."
        after: "Six factors kept showing up in the findings, all tangled together. Pull one thread and the others move."
      - before: "The team demonstrated remarkable resilience in navigating the complexities of this transformative endeavor."
        after: "The team gutted it out. Three months of messy, frustrating work -- but they got it done."

  showing_over_telling:
    strategy: "Replace abstract telling statements with vivid showing descriptions using sensory details and concrete examples"
    rules:
      - "Convert 'telling' sentences into 'showing' sentences with specific, observable details"
      - "Use sensory language: what you can see, hear, feel, taste, or smell"
      - "Replace summary statements with concrete examples or mini-scenes"
      - "Use specific numbers, names, and observable actions instead of general assessments"
      - "Not every sentence needs to 'show' -- reserve this for key points and emotional beats"
      - "Technical/analytical passages may need 'telling' for clarity -- use judgment"
    examples:
      - before: "The meeting was productive."
        after: "We walked out with three decisions, two action items, and for once, no unresolved arguments."
      - before: "The team was frustrated with the delays."
        after: "By the third postponement, the team stopped RSVPing to sprint demos. The Slack channel went quiet."
      - before: "The product launch was a success."
        after: "Traffic spiked 400% in the first hour. The support queue stayed empty. Marketing was already drafting the case study by lunch."
      - before: "The architecture is complex."
        after: "The architecture has fourteen microservices, three message queues, and a dependency graph that fills a whiteboard."
      - before: "User engagement improved significantly."
        after: "Users went from opening the app twice a week to checking it daily. Session lengths doubled."

  natural_tangent_injection:
    strategy: "Allow slight tangents and digressions that mimic natural human thought flow"
    rules:
      - "Allow 1-2 brief tangents per major section -- no more"
      - "Tangents should add texture, insight, or personality -- not just fill space"
      - "After the tangent, bring it back to the main point naturally"
      - "Tangent types: brief anecdote, related observation, parenthetical aside, 'speaking of which' digression"
      - "Keep tangents short: 1-2 sentences maximum"
      - "Do NOT force tangents -- only add where they arise naturally from the content"
      - "Tangents work best in narrative, essay, and informal analytical writing; avoid in specifications and instructions"
    examples:
      - before: "The team decided to adopt microservices. The transition took six months."
        after: "The team decided to adopt microservices. (Not that anyone agreed on what 'microservice' meant at first -- that debate alone ate two sprints.) The transition took six months."
      - before: "Cloud costs increased by 40% in Q3. We implemented cost controls in Q4."
        after: "Cloud costs increased by 40% in Q3. Forty percent -- the kind of number that makes finance send you a meeting invite with no subject line. We implemented cost controls in Q4."
      - before: "The research supports early intervention. Programs should start in elementary school."
        after: "The research supports early intervention. There's a study from Helsinki -- small sample, but the results are striking -- that tracked outcomes over twenty years. Programs should start in elementary school."

  repetition_consolidation:
    strategy: "Merge repeated points into single strong statements"
    rules:
      - "Find semantic duplicates within 3 sentences of each other"
      - "Keep the stronger version, remove the weaker"
      - "In conclusions, do not repeat body content"
    examples:
      - before: "This is important for growth. Growth depends on this factor. Without this, growth will stall."
        after: "Growth depends on this."

  hedging_reduction:
    strategy: "Replace non-committal language with definitive statements, but PRESERVE hedging where genuine uncertainty exists"
    rules:
      - "Replace 'might' with 'will' or 'does' when evidence supports it"
      - "Remove 'could potentially' -- just say 'could' or state directly"
      - "Keep hedges for genuinely uncertain claims -- do NOT remove all hedging"
      - "PRESERVE 'may', 'might', 'could' when the claim is genuinely speculative or forward-looking"
      - "PRESERVE 'seems to suggest', 'potentially' when data is preliminary or inconclusive"
      - "Human writers hedge naturally on uncertain topics -- removing ALL hedging is itself an AI tell"
      - "Target: remove ~60% of hedging (the performative, unnecessary kind), keep ~40% (the genuine uncertainty kind)"
      - "When in doubt, keep the hedge -- over-confident writing is as much an AI signal as over-hedged writing"
    examples:
      - before: "This could potentially have a significant impact on future outcomes"
        after: "This will change how things work"
        note: "Performative hedge removed -- evidence supports the claim"
      - before: "It might perhaps be worth considering"
        after: "Consider this"
        note: "Unnecessary double-hedge removed"
      - before: "Early results suggest this may improve outcomes by 15-20%"
        after: "Early results suggest this may improve outcomes by 15-20%"
        note: "KEEP -- genuinely preliminary data, hedge is appropriate"
      - before: "This approach could reshape the industry within five years"
        after: "This approach could reshape the industry within five years"
        note: "KEEP -- forward-looking speculation, hedge is warranted"
      - before: "The data seems to indicate a correlation, though more research is needed"
        after: "The data suggests a correlation. More research will tell."
        note: "Simplified but hedge preserved -- the uncertainty is real"

  warmth_removal:
    strategy: "Remove performative empathy and hollow encouragement"
    rules:
      - "Delete generic warm phrases that add no information"
      - "Replace with specific, genuine engagement if appropriate"
      - "Or simply remove -- silence is better than hollow warmth"
    examples:
      - before: "We all know that change is hard. And that's okay."
        after: "[removed]"
      - before: "Keep pushing forward, you've got this!"
        after: "[removed, or replaced with a concrete next step]"
      - before: "Remember, every journey begins with a single step."
        after: "[removed]"

  lacks_creativity_rewrite:
    strategy: "Inject creative richness into precise-but-flat prose flagged with the Lacks Creativity pattern"
    named_pattern: "Lacks Creativity"
    rules:
      - "Replace abstract descriptions with concrete, sensory details"
      - "Add specific proper nouns: real place names, brand names, cultural references"
      - "Introduce at least one original metaphor or analogy per 500 words"
      - "Break predictable adjective-noun pairings with unexpected but apt combinations"
      - "Replace generic examples with specific, vivid ones"
      - "Do not invent facts -- use plausible specifics or flag for author with [AUTHOR: add specific detail]"
    examples:
      - before: "The application provides comprehensive functionality for data management across diverse organizational contexts."
        after: "The app handles data management -- whether you're a three-person startup in Austin or a sprawling government agency."
      - before: "The solution addresses the significant challenges facing modern enterprises in a competitive landscape."
        after: "The solution tackles the kind of problems that keep CTOs up at night: data silos, slow deploys, and teams that can't ship without stepping on each other."
      - before: "The technology enables effective communication across distributed teams."
        after: "A team in Berlin, another in Sao Paulo, a third working from kitchen tables across Montana -- the tool keeps them all in sync."

  rich_yet_shallow_rewrite:
    strategy: "Inject emotional depth and spontaneity into vocabulary-rich but emotionally flat prose flagged with the Rich Yet Shallow pattern"
    named_pattern: "Rich Yet Shallow"
    rules:
      - "Replace ornamental vocabulary ('myriad of', 'plethora of') with specific quantities or plain language"
      - "Add colloquialisms and conversational markers where register permits ('honestly', 'look', 'the truth is')"
      - "Insert genuine emotional reactions: surprise, frustration, delight, skepticism"
      - "Add visceral or sensory language to replace emotionally neutral descriptions"
      - "Break the pattern of sophisticated-but-hollow prose by mixing registers"
      - "Where the author's emotional reaction is unknown, flag: [AUTHOR: how did this make you feel?]"
    examples:
      - before: "The framework demonstrates significant capability through its multifaceted approach to processing complex datasets with remarkable efficiency."
        after: "Honestly, the framework punches above its weight. It chews through messy datasets that would choke most tools."
      - before: "The initiative encompassed a comprehensive array of strategic considerations that collectively informed the organizational trajectory."
        after: "The initiative forced us to rethink everything. Frustrating? Absolutely. But we came out of it with a plan that actually makes sense."
      - before: "The findings illuminate a constellation of interconnected factors that collectively influence the observed outcomes."
        after: "Six factors kept showing up in the findings, all tangled together. Pull one thread and the others move."

  predictable_rhythm_rewrite:
    strategy: "Break metronomic rhythm in prose flagged with the Predictable Rhythm pattern"
    named_pattern: "Predictable Rhythm"
    rules:
      - "Insert short 'breath point' sentences (3-7 words) between longer passages"
      - "Convert some declarative sentences to rhetorical questions or imperatives"
      - "Add sentence inversions ('Rarely does...', 'Not once did...')"
      - "Ensure at least 3 different sentence types in the rewritten passage"
      - "Follow two similar-length sentences with a drastically different length"
      - "Vary paragraph rhythm: short punchy paragraphs next to flowing ones"
    examples:
      - before: "The system processes requests efficiently. The system handles errors gracefully. The system scales horizontally. The system maintains consistency."
        after: "The system processes requests efficiently and handles errors without crashing. Does it scale? Horizontally, yes. Consistency? Rock solid."
      - before: "The research demonstrates positive outcomes. The evidence supports the conclusion. The data validates the hypothesis. The findings confirm the theory."
        after: "The research is clear. Positive outcomes across the board. Every data point validates the hypothesis -- not a single outlier. When does that ever happen?"

  lacks_creative_grammar_rewrite:
    strategy: "Introduce human grammatical personality into sterile prose flagged with the Lacks Creative Grammar pattern"
    named_pattern: "Lacks Creative Grammar"
    rules:
      - "Add intentional fragments for emphasis (1-2 per 500 words)"
      - "Insert one-word sentences for impact ('Done.' 'Never.' 'Why?')"
      - "Add parenthetical asides that reveal thought process"
      - "Use dashes to create mid-sentence interruptions or afterthoughts"
      - "Introduce sentence inversions for emphasis ('Rarely does...' 'Gone are...')"
      - "Add trailing ellipses sparingly where thoughts naturally trail off"
      - "Match frequency to register -- more in informal, fewer in formal"
    examples:
      - before: "The results were clear and there was no room for debate on the matter at hand."
        after: "The results were clear. No debate. Done."
      - before: "We should consider the cost implications carefully before proceeding with the proposed changes."
        after: "The cost implications -- and they're not trivial -- deserve a hard look before we move forward."
      - before: "This approach has rarely been attempted in the industry and it remains to be seen whether it will succeed."
        after: "Rarely has anyone in this industry tried this. Will it work? That's the question."

  mechanical_precision_rewrite:
    strategy: "Humanize clinical precision in prose flagged with the Mechanical Precision pattern"
    named_pattern: "Mechanical Precision"
    rules:
      - "Introduce contractions to break uniform formality ('we have' -> 'we've', 'it is' -> 'it's')"
      - "Add conversational markers ('honestly', 'look', 'well', 'in practice')"
      - "Include at least one register shift per 500 words (formal to informal or vice versa)"
      - "Allow playful or emotionally expressive language alongside functional vocabulary"
      - "Break the uniform formality with occasional colloquial phrasing"
      - "Replace some precision-optimized words with simpler, more human alternatives"
    examples:
      - before: "The implementation utilizes a systematic approach to facilitate optimal performance outcomes."
        after: "We went with a structured approach. It works -- honestly, better than we expected."
      - before: "The analysis reveals that the proposed solution addresses the identified requirements with a high degree of specificity."
        after: "The analysis checks out. The solution hits every requirement we identified -- and a few we didn't think of."
      - before: "The data indicates a statistically significant correlation between the two variables under examination."
        after: "The numbers are clear: these two variables are linked. Not loosely, either -- the correlation is strong."

  perfect_grammar_zero_thought_rewrite:
    strategy: "Inject both grammatical informalities and thought-process markers when flagged with the Perfect Grammar + Zero Thought Markers pattern"
    named_pattern: "Perfect Grammar + Zero Thought Markers"
    rules:
      - "This is one of the strongest AI signals -- address aggressively"
      - "Inject 2-3 subtle grammatical informalities per 1000 words (comma splices, preposition endings, split infinitives)"
      - "Inject 3-4 human thought-process markers per 1000 words (fillers, self-corrections, hesitations)"
      - "Both types must be present -- either alone is insufficient"
      - "Spread evenly across the document; do not cluster"
      - "Match informality type to register"
    examples:
      - before: "The analysis reveals that the proposed methodology addresses the identified requirements with a high degree of specificity and thoroughness."
        after: "The analysis checks out -- honestly, better than we expected. The methodology hits every requirement we identified, and sort of accidentally covers a few we didn't think of."
      - before: "The system processes transactions reliably across all deployment configurations."
        after: "The system processes transactions reliably, it works across all deployment configurations we've tested. Actually, wait -- there was one edge case in the distributed setup. But they patched that in the last release."

  linear_argumentation_rewrite:
    strategy: "Restructure linear arguments with counter-arguments and non-linear reasoning when flagged with the Linear Argumentation pattern"
    named_pattern: "Linear Argumentation"
    rules:
      - "For each flagged linear argument, acknowledge at least one counter-argument"
      - "Use natural counter-argument patterns: 'Sure, you could argue X, but...' or 'Fair point about X. However...'"
      - "Introduce at least one non-linear element: lead with a question, start with the conclusion, use example-first reasoning"
      - "Include at least one self-correction or uncertainty acknowledgment"
      - "Target: no more than 50% of arguments should follow strict claim-evidence-conclusion"
      - "Do NOT use formulaic 'on one hand / on the other hand'"
    examples:
      - before: "Data shows that remote work increases productivity. Multiple studies confirm this finding. Organizations should therefore adopt remote work policies."
        after: "Does remote work increase productivity? The data says yes -- multiple studies, different methodologies, same conclusion. Though I should note: the studies mostly cover knowledge workers. Manufacturing, healthcare, retail? Different story entirely. For office-based teams, though? The case for remote work is strong."
      - before: "Step one: analyze the problem. Step two: design the solution. Step three: implement and test."
        after: "Start by understanding what's actually broken. Not what the ticket says -- what's really going on underneath. The solution usually suggests itself once you see the real problem. Then build it, test it. Sometimes you'll realize halfway through that you misdiagnosed the issue. That's fine. Adjust."

  sophisticated_clarity_rewrite:
    strategy: "Add natural flow to uniformly sophisticated prose flagged with the Sophisticated Clarity pattern"
    named_pattern: "Sophisticated Clarity"
    rules:
      - "Inject short, punchy sentences between elaborate ones"
      - "Add digressions or tangential observations where they serve the text"
      - "Allow the occasional simple word where a complex one would normally appear"
      - "Break uniform sophistication with moments of plainspoken directness"
      - "Introduce informal register elements that contrast with the sophisticated baseline"
      - "Add rhythm variation by mixing simple and complex sentences"
    examples:
      - before: "The comprehensive analysis demonstrates that the sophisticated methodological framework yields substantive improvements in operational efficiency across multiple dimensions."
        after: "The analysis is clear: this framework improves efficiency. Not incrementally, either. We're talking real gains."
      - before: "The pedagogical implications of these findings suggest a fundamental reconceptualization of how educational institutions approach curriculum development and instructional methodology."
        after: "These findings change how we should think about teaching. Not tweaks to the curriculum -- a rethink of the whole approach. That's a big ask for most schools."
      - before: "The synthesis of these disparate research threads yields a coherent theoretical framework that elucidates the underlying mechanisms governing the observed phenomena."
        after: "Pull these research threads together and a picture emerges. We can finally explain why this happens. Simple version? The mechanisms work together, not in isolation."

# ==============================================================================
# Pass 5 Strategies: Subtext & Coherence Verification
# ==============================================================================
pass_5:
  name: "Subtext & Coherence Verification"
  categories: [conflicting_subtext]
  priority: 5
  description: "Fix subtext conflicts and verify document coherence"

  backhanded_praise_fix:
    strategy: "Separate praise from criticism into clear, distinct statements"
    rules:
      - "Split compound sentences that praise then undermine"
      - "State praise genuinely, then state concerns separately"
      - "Do not sandwich criticism between compliments"
    examples:
      - before: "While the team's effort was commendable, the results speak for themselves"
        after: "The team worked hard. The results fell short of what we needed."
      - before: "Although this is an impressive achievement, it merely scratches the surface"
        after: "This is a real achievement. There's more to do, but this is a strong start."

  qualifier_negation_fix:
    strategy: "Prevent qualifiers from undermining their main clause"
    rules:
      - "If the qualifier contradicts the main point, choose one or the other"
      - "If both points are valid, make them separate sentences"
    examples:
      - before: "While impressive, this falls short of expectations"
        after: "This is impressive work. It's not yet where we need it to be."
      - before: "Despite being well-designed, the system fails under load"
        after: "The design is solid. Performance under load is the problem."

  tone_content_alignment:
    strategy: "Match emotional tone to content gravity"
    rules:
      - "Serious topics get measured language"
      - "Positive topics can be enthusiastic"
      - "Do not use upbeat language for negative outcomes"
    examples:
      - before: "We appreciate your patience during this exciting transition (layoffs)"
        after: "We know this transition has been difficult. Here's what we're doing about it."

  coherence_verification:
    strategy: "Final read-through for unified voice and logical consistency"
    rules:
      - "Read the full document as a continuous text"
      - "Check that rewrites from passes 1-4 did not create new conflicts"
      - "Verify paragraph-to-paragraph logical flow"
      - "Ensure the document reads as one voice, not a patchwork"
      - "Flag any remaining passages that need author input"

# ==============================================================================
# Cross-Pass: Perplexity & Burstiness Strategies
# ==============================================================================
perplexity_burstiness:
  name: "Perplexity & Burstiness Enhancement"
  applies_to: [pass_1, pass_2, pass_3, pass_4, pass_5]
  description: "Strategies applied across all passes to increase text perplexity (unpredictability) and burstiness (complexity variation)"

  increase_perplexity:
    strategy: "Make word choices less predictable while preserving meaning"
    rules:
      - "Choose unexpected but apt synonyms over the obvious choice -- 'the project cratered' instead of 'the project failed'"
      - "Use idiomatic expressions that break predictable patterns -- 'hit the ground running' over 'began immediately'"
      - "Introduce domain-crossing vocabulary: borrow terms from one field to describe another"
      - "Replace common collocations with surprising but natural pairings"
      - "Use culturally specific references that add unpredictability -- a real restaurant name, a specific street, a niche cultural reference"
      - "Vary register unpredictably: drop into casual language in a formal passage, or use a precise technical term in casual prose"
      - "Avoid the first synonym that comes to mind; reach for the second or third option"
    examples:
      - before: "The project was successful and met its goals."
        after: "The project landed. Every milestone, hit. The kind of outcome that makes you suspicious something was missed."
      - before: "The team worked together effectively."
        after: "The team clicked -- that rare chemistry where everyone's pulling the same direction without a single awkward meeting about it."
      - before: "This approach has several advantages."
        after: "This approach has teeth. Three advantages that actually hold up under scrutiny."

  increase_burstiness:
    strategy: "Deliberately vary complexity and reading level across passages"
    rules:
      - "Follow a dense, multi-clause paragraph with a short, punchy one (1-2 sentences)"
      - "Mix reading levels: some sentences at grade 6 ('It works.'), others at grade 14 ('The recursive instantiation of dependent modules necessitates careful orchestration of lifecycle events.')"
      - "Alternate between technical precision and casual directness within the same section"
      - "Create 'complexity valleys' -- passages of deliberate simplicity between peaks of elaboration"
      - "Vary paragraph lengths dramatically: a 1-sentence paragraph followed by a 6-sentence one"
      - "Ensure at least 30% of sentences differ by 50%+ in word count from their neighbors"
      - "Alternate between abstract analysis and concrete, ground-level description"
    examples:
      - before: "The framework supports multiple deployment configurations. The framework enables integration with existing systems. The framework provides monitoring capabilities. The framework handles scaling automatically."
        after: |
          The framework plugs into what you already have. Deployments? Multiple configurations, pick your flavor.

          But here's where it gets interesting. The monitoring -- and I mean real monitoring, not just uptime pings -- feeds directly into the auto-scaling logic. Your traffic spikes at 2 AM on a Tuesday because someone posted your link on Reddit? The framework notices before you do. It scales. It settles. You sleep through it.

          Simple as that.

  increase_lix_variance:
    strategy: "Vary LIX readability scores across sections for natural human complexity patterns"
    rules:
      - "Target high average LIX (45-55 range) with high variance (std dev > 8.0)"
      - "Write introductions and transitions with short sentences and common words (LIX 25-35)"
      - "Write analytical and technical passages with longer sentences and specialized vocabulary (LIX 50-60)"
      - "Ensure the gap between simplest and most complex section exceeds 20 LIX points"
      - "Vary average sentence length between sections: some sections avg 12 words/sentence, others avg 25+"
      - "Use polysyllabic vocabulary in dense passages, monosyllabic vocabulary in punchy passages"
      - "Create deliberate 'rest stops' -- easy-reading paragraphs between challenging ones"
    lix_reference:
      very_easy: "< 25: Short sentences, simple words. 'It works. Fast. Clean.'"
      easy: "25-35: Clear prose, conversational. 'The tool does what it promises and gets out of the way.'"
      medium: "35-45: Standard professional. 'Organizations implementing this framework should anticipate measurable improvements within the first quarter.'"
      difficult: "45-55: Academic/technical. 'The recursive instantiation of dependent modules necessitates careful orchestration of asynchronous lifecycle events across distributed execution contexts.'"
      very_difficult: "55+: Dense specialist. 'Notwithstanding the aforementioned methodological constraints inherent in cross-sectional epidemiological investigations, the preponderance of longitudinal evidence substantiates the hypothesized dose-response relationship.'"
    examples:
      - before: "The system handles requests. The system processes data efficiently. The system scales well. The system is reliable."
        after: |
          The system handles requests. Fast.

          Under the hood, the request-processing pipeline orchestrates a cascade of asynchronous handlers, each operating within its own bounded execution context and competing for shared resources through a lock-free concurrent queue. It's the kind of architecture that looks simple from the outside -- and that simplicity is the whole point.

          Reliable? Dead reliable.

# ==============================================================================
# Voice Profile Parameters
# ==============================================================================
voice_profile:
  analyzable_features:
    - avg_sentence_length
    - sentence_length_variance
    - vocabulary_level          # reading grade level
    - contraction_frequency     # contractions per 100 words
    - punctuation_preferences   # semicolons, dashes, parentheses per 1000 words
    - formality_level           # 1-5 scale
    - humor_frequency           # humorous passages per 1000 words
    - opinion_strength          # hedged (1) to direct (5)
    - favorite_structures       # common sentence patterns
    - characteristic_phrases    # author's signature expressions
  application:
    - "Match sentence length distribution to reference"
    - "Use vocabulary at the same reading level"
    - "Mirror punctuation patterns"
    - "Match contraction frequency"
    - "Preserve author's characteristic phrases"
    - "Match formality level and opinion strength"

# ==============================================================================
# Persona-Based Voice Adaptation
# ==============================================================================
persona_adaptation:
  name: "Persona-Based Voice Adaptation"
  applies_to: [pass_1, pass_2, pass_3, pass_4, pass_5]
  description: "Adopt a specific persona's voice, mannerisms, and writing quirks across all passes"

  persona_voice_capture:
    strategy: "Identify and apply 3-5 characteristic patterns for the specified persona"
    rules:
      - "Each persona has distinctive vocabulary, sentence patterns, and stylistic quirks"
      - "Identify the persona's likely register (formal, semi-formal, casual)"
      - "Determine the persona's opinion strength (hedged vs. direct)"
      - "Find the persona's natural imperfections (comma splices, over-hedging, exclamation overuse)"
      - "Apply patterns consistently but not robotically -- allow natural drift"
    personas:
      forgetful_academic:
        vocabulary: "precise but occasionally tangential"
        patterns: ["parenthetical asides", "self-corrections mid-sentence", "'Now, where was I'", "'as I was saying'"]
        imperfections: ["loses thread and circles back", "over-qualifies", "drops in Latin phrases"]
        register: "formal with occasional informal asides"
      passionate_activist:
        vocabulary: "emotional, urgent, specific statistics"
        patterns: ["short imperative sentences", "rhetorical questions", "calls to action", "emotional appeals"]
        imperfections: ["occasional hyperbole", "sentences that run long from passion"]
        register: "semi-formal with emotional spikes"
      humorous_storyteller:
        vocabulary: "vivid, unexpected comparisons, cultural references"
        patterns: ["anecdote openers", "punchline structure", "comic timing via sentence length", "sardonic asides"]
        imperfections: ["gets sidetracked by jokes", "occasional too-clever wordplay"]
        register: "casual to semi-formal, flexible"
      cynical_journalist:
        vocabulary: "precise, source-attributed, skeptical"
        patterns: ["punchy ledes", "source citations", "'according to'", "dry one-liners"]
        imperfections: ["overly terse", "drops context assuming reader knows background"]
        register: "professional with dry humor"
      startup_founder:
        vocabulary: "metric-obsessed, future-oriented, energetic"
        patterns: ["numbers and percentages", "'we shipped'", "war metaphors", "vision statements"]
        imperfections: ["over-optimistic", "buzzword-adjacent", "switches between casual and pitch-mode"]
        register: "casual-but-strategic"

# ==============================================================================
# Output Configuration
# ==============================================================================
output:
  rewritten_document:
    naming: "{original_name}.rewritten.{ext}"
    format: "Same format as original"
  rewrite_summary:
    naming: "rewrite_summary.yaml"
    fields:
      - input_document
      - detection_report
      - output_document
      - changes_by_pass
      - total_changes
      - author_review_flags
      - original_score
      - estimated_new_score
  author_flags:
    format: "[AUTHOR: {instruction}]"
    types:
      - "take a position here"
      - "confirm your position"
      - "name the company"
      - "intentional ambiguity?"
      - "add specific detail"
      - "verify this claim"
