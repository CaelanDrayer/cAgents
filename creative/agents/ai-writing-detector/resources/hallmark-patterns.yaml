# ==============================================================================
# Category 2: Analytical/Academic Words (weight: 0.08)
# ==============================================================================
analytical_academic:
  weight: 0.08
  signal_strength: medium
  description: "Overly formal connectives, academic vocabulary, and domain-inappropriate technical jargon"
  detection_threshold:
    density: 5    # per 1000 words; 1-2 is normal academic writing
  patterns:
    - furthermore
    - moreover
    - consequently
    - subsequently
    - thereby
    - wherein
    - hitherto
    - notwithstanding
    - juxtaposition
    - dichotomy
    - extrapolate
    - elucidate
    - delineate
    - contextualize
    - posit
    - ascertain
    - predicated
    - promulgate
    - advancements
    - implications
    - paradigm
    - synergy
  technical_jargon:
    description: "Technical jargon and advanced vocabulary used outside appropriate technical context"
    patterns:
      - "utilize"          # when "use" works
      - "facilitate"       # when "help" or "enable" works
      - "methodology"      # when "method" or "approach" works
      - "functionality"    # when "feature" or "ability" works
      - "implementation"   # when "setup" or "use" works
      - "infrastructure"   # in non-technical contexts
      - "optimization"     # when "improvement" works
      - "operationalize"   # when "put into practice" works
      - "systematize"      # when "organize" works
      - "conceptualize"    # when "imagine" or "think about" works
      - "instantiate"      # in non-programming contexts
      - "parameterize"     # in non-technical contexts
      - "incentivize"      # when "motivate" or "encourage" works
      - "synergize"        # when "combine" or "work together" works
    rule: "Flag when technical vocabulary appears in non-technical prose or when simpler alternatives exist"
  complex_clause_density:
    description: "Sentences with 3+ subordinate clauses conveying detailed information"
    threshold: 3    # clauses per sentence; flag if avg exceeds this
    patterns:
      - "which .+ that .+ where"
      - "although .+ while .+ because"
      - "given that .+ in order to .+ so that"
    rule: "Flag sentences with multiple nested clauses that could be broken into simpler statements"
  technical_jargon_complexity:
    description: "Complex sentence structures with multiple clauses convey detailed information and nuanced arguments, often using technical jargon and advanced vocabulary"
    named_pattern: "Technical Jargon"
    composite_checks:
      - technical_jargon_density_high       # technical_jargon patterns > 5 per 1000 words
      - complex_clause_density_high         # avg clause count > 2.5 per sentence
      - advanced_vocabulary_density_high    # academic vocabulary > 8 per 1000 words
    detection:
      all_of:
        - { check: technical_jargon_density, threshold: 5, unit: "per 1000 words" }
        - { check: avg_clause_count, threshold: 2.5, unit: "clauses per sentence" }
        - { check: academic_vocabulary_density, threshold: 8, unit: "per 1000 words" }
    rule: "AI produces text where complex grammatical structures and specialized vocabulary serve as vehicles for detailed but often generic information, rather than being necessitated by the content's actual complexity"

# ==============================================================================
# Category 3: Punctuation/Style Tics (weight: 0.08)
# ==============================================================================
punctuation_style:
  weight: 0.08
  signal_strength: medium
  description: "Characteristic punctuation patterns of AI-generated text"
  checks:
    em_dash_overuse:
      description: "AI uses em dashes for explanatory clauses and dramatic pauses"
      threshold: 2      # per 500 words
      pattern: "---?|\\u2014"
    colon_list_patterns:
      description: "Colon followed by list structure"
      patterns:
        - "Here are the key"
        - "Here's what"
        - "Consider the following"
        - "The main points are:"
        - "Key takeaways:"
        - "Important considerations:"
    oxford_comma_consistency:
      description: "AI uses Oxford commas 100% consistently"
      threshold: 1.0    # flag if every serial comma uses Oxford
    semicolon_absence:
      description: "AI rarely uses semicolons unlike human academic writing"
      threshold: 0       # per 1000 words; flag if zero
    perfect_punctuation:
      description: "No creative use of ellipsis, fragments, unconventional punctuation"
      patterns_absent:
        - "..."
        - sentence_fragments
        - exclamation_clusters

  # Sub-signal: Boldface/Emoji Overuse
  boldface_emoji_overuse:
    description: "Heavy markdown formatting as structural crutch; emoji in non-chat contexts"
    checks:
      boldface_density:
        description: "Proportion of words wrapped in **bold** markdown"
        threshold: 0.05    # flag if > 5% of words are bolded
      emoji_in_prose:
        description: "Emoji characters appearing in formal or semi-formal text"
        threshold: 0       # flag any emoji in non-chat contexts
        emoji_patterns:
          - "\\p{Emoji_Presentation}"
          - "\\p{Extended_Pictographic}"
      bold_key_terms:
        description: "Pattern of bolding 'key terms' in every paragraph"
        threshold: 3       # flag if 3+ paragraphs each have bolded terms
    rule: "AI uses markdown formatting as a structural crutch -- bolding key terms for emphasis instead of using prose emphasis, and inserting emoji as visual anchors. In formal writing, emoji never appear; in semi-formal writing, their presence is a strong AI tell."

# ==============================================================================
# Category 4: Structural Patterns (weight: 0.12)
# ==============================================================================
structural_patterns:
  weight: 0.12
  signal_strength: strong
  description: "Formulaic document organization typical of AI output"
  checks:
    formulaic_headers:
      patterns:
        - "## Introduction"
        - "## Key Takeaways"
        - "## Conclusion"
        - "## Summary"
        - "## Overview"
        - "## Background"
        - "## Key Points"
        - "## Final Thoughts"
    excessive_lists:
      threshold: 0.40    # flag if > 40% content in lists
    conclusion_patterns:
      patterns:
        - "In conclusion"
        - "To summarize"
        - "In summary"
        - "Overall,"
        - "To sum up"
        - "In closing"
        - "To wrap up"
    paragraph_uniformity:
      threshold: 0.20    # flag if all paragraphs within 20% of average length
    three_point_pattern:
      description: "Everything in groups of three"
    mid_essay_bullets:
      description: "Bullet lists appearing where flowing prose is more natural"
    long_conclusions:
      description: "Conclusions that repeat most of the content"
      overlap_threshold: 0.50  # flag if > 50% semantic overlap with body

