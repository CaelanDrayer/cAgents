      - "from research to application"
      - "from strategy to action"
    rule: "AI uses 'from X to Y' as a structural crutch for organizing binary concepts. Human writers occasionally use this construction, but AI uses it systematically to create false symmetry."

# ==============================================================================
# Category 6: Transitions (weight: 0.06)
# ==============================================================================
transitions:
  weight: 0.06
  signal_strength: weak
  description: "Performative navigation phrases and mechanical subordinate-clause connectors"
  patterns:
    - "Let's explore"
    - "Let's dive in"
    - "Let's dive deeper"
    - "Moving on to"
    - "Now let's turn our attention to"
    - "Having established"
    - "With that in mind"
    - "That being said"
    - "Building on this"
    - "Taking a step back"
    - "It's also worth exploring"
    - "Let's delve into"
    - "With this in mind"
    - "As we turn to"
    - "Let's take a closer look"
    - "Now that we've covered"
    - "Turning our attention to"
    - "As we move forward"
  mechanical_transitions:
    description: "Complex grammatical structures using subordinate clauses and transitional phrases to connect ideas in a formulaic way"
    patterns:
      - "In light of the fact that"
      - "In consideration of"
      - "With regard to"
      - "In relation to"
      - "With respect to"
      - "In terms of"
      - "In the context of"
      - "As a consequence of"
      - "As a result of this"
      - "In conjunction with"
      - "By virtue of"
      - "On the basis of"
      - "For the purpose of"
      - "With the aim of"
      - "In accordance with"
    subordinate_clause_bridges:
      description: "Using subordinate clauses as mechanical paragraph bridges"
      patterns:
        - "^While .+, it is"
        - "^Although .+, this"
        - "^Given that .+, we"
        - "^Considering .+, the"
        - "^As .+ continues to .+, it"
        - "^Since .+ has .+, the"
      rule: "AI uses subordinate clause openers as formulaic bridges between paragraphs -- same pattern repeated"
      threshold: 3    # flag if 3+ paragraphs begin with subordinate clause bridges

# ==============================================================================
# Category 7: Qualifiers & Softening (weight: 0.06)
# ==============================================================================
qualifiers_softening:
  weight: 0.06
  signal_strength: weak
  description: "Unnecessary hedging and over-explanation of simple points"
  patterns:
    - "It's worth noting"
    - "It's important to remember"
    - "It's important to note"
    - "while this may vary"
    - "to some extent"
    - "in many ways"
    - "it should be noted that"
    - "one could argue"
    - "it bears mentioning"
    - "generally speaking"
    - "broadly speaking"
    - "of course"
    - "as previously mentioned"
    - "needless to say"
    - "it goes without saying"

# ==============================================================================
# Category 8: Tone/Voice (weight: 0.12)
# ==============================================================================
tone_voice:
  weight: 0.12
  signal_strength: strong
  description: "Authoritative yet non-committal AI voice -- formal, positive, vague, no perspective"
  checks:
    diplomatic_phrasing:
      description: "Never taking a strong position"
      patterns:
        - "on one hand"
        - "on the other hand"
        - "there are valid points on both sides"
        - "it depends on the context"
    corporate_speak:
      patterns:
        - "stakeholder alignment"
        - "value proposition"
        - "synergize"
        - "leverage"
        - "actionable insights"
        - "circle back"
        - "move the needle"
        - "thought leadership"
    impersonal_authority:
      patterns:
        - "research suggests"
        - "experts agree"
        - "studies show"
        - "it is widely recognized"
        - "it is generally accepted"
    helpfulness_markers:
      patterns:
        - "I hope this helps"
        - "feel free to"
        - "don't hesitate to"
        - "happy to help"
        - "let me know if"
    formality_uniformity:
      description: "No tonal variation throughout the text"
    criticism_absence:
      description: "Overly positive, avoids all criticism or negative assessment"
    humor_absence:
      description: "No humor, sarcasm, irony, or playful register shifts"

  # Sub-signal: Vague Attributions
  # Sourceless authority claims without naming specific sources
  vague_attributions:
    description: "Authority claims without specific named sources"
    detection_threshold:
      density: 3          # 3+ vague attributions without any specific sourcing
    phrases:
      - "experts argue"
      - "experts say"
      - "experts believe"
      - "experts suggest"
      - "many believe"
      - "many argue"
      - "many experts"
      - "research suggests"
      - "studies show"
      - "studies have shown"
      - "studies suggest"
      - "research has shown"
      - "research indicates"
      - "according to experts"
      - "according to research"
      - "according to studies"
      - "some argue"
      - "some believe"
      - "some experts"
      - "it is widely believed"
      - "it is generally agreed"
      - "scholars note"
      - "analysts say"
      - "critics argue"
      - "observers note"
    rule: "Human writers either cite specific sources or make claims on their own authority. AI hedges by invoking unnamed experts, studies, and research. The combination of authoritative framing with zero specific attribution is a strong AI signal."

# ==============================================================================
# Category 9: Creativity Deficit (weight: 0.12)
# ==============================================================================
creativity_deficit:
  weight: 0.12
  signal_strength: strong
  description: "Safe, predictable language lacking genuine creative spark"
  checks:
    generic_metaphors:
      patterns:
        - "tip of the iceberg"
        - "double-edged sword"
        - "a breath of fresh air"
        - "stands out from the crowd"
        - "at the end of the day"
        - "food for thought"
        - "the elephant in the room"
        - "a game changer"
        - "think outside the box"
    predictable_pairings:
      patterns:
        - "crucial role"
        - "significant impact"
        - "bustling city"
        - "quiet determination"
        - "rich tapestry"
        - "vast landscape"
        - "pivotal moment"
        - "profound impact"
        - "invaluable resource"
        - "vibrant community"
    ai_names:
      description: "Generic names defaulted to by AI"
      patterns:
        - Emily
        - Sarah
        - Alex
        - James
        - Sophia
        - Ethan
        - Olivia
        - Liam
        - Maya
        - Noah
    proper_noun_deficit:
      description: "Avoids real place names, brand names, specific references"
    cultural_specificity_deficit:
      description: "Generic 'city' instead of specific places like Portland or Osaka"
    specificity_deficit:
      description: "Abstract instead of concrete, sensory details"
    rich_yet_shallow_vocabulary:
      description: "Rich and varied vocabulary that lacks spontaneity and emotional depth"
      checks:
        high_lexical_diversity_low_emotion:
          description: "Vocabulary diversity score is high but emotional/sensory word ratio is low"
          lexical_diversity_threshold: 0.70   # flag if type-token ratio above this
          emotion_word_threshold: 2           # per 1000 words; flag if below this
        absence_of_spontaneous_language:
          description: "No colloquialisms, slang, informal expressions, or conversational asides"
          patterns_absent:
            - colloquialisms
            - informal_interjections    # "honestly", "look", "I mean", "y'know"
            - conversational_hedges     # "sort of", "kind of", "like" (informal)
            - visceral_reactions        # "gut feeling", "makes my skin crawl", "hit me like"
        emotional_flatness:
          description: "Vocabulary is sophisticated but emotionally neutral -- no joy, frustration, surprise, anger"
          emotion_categories_absent:
            - joy_delight       # "thrilling", "loved it", "exciting"
            - frustration_anger # "infuriating", "maddening", "annoying"
            - surprise_wonder   # "astonishing", "blew my mind", "jaw-dropping"
            - sadness_loss      # "heartbreaking", "devastating", "gutting"
            - humor_amusement   # "hilarious", "cracked up", "absurd"
          rule: "Human writers naturally express emotion; AI produces emotionally flat text with impressive vocabulary"
        ornamental_vocabulary:
          description: "Advanced words used decoratively rather than precisely"
          patterns:
            - "myriad of"
            - "plethora of"
            - "cornucopia of"
            - "panoply of"
            - "constellation of"
            - "mosaic of"
            - "kaleidoscope of"
          rule: "AI uses advanced vocabulary as ornamentation; humans use it for precision"
    lacks_creativity:
      description: "The writing is precise and consistent but lacks the richness and creativity of human writing"
      named_pattern: "Lacks Creativity"
      composite_checks:
        - specificity_deficit_present        # abstract over concrete/sensory details
        - literary_device_absence_present    # no metaphors, similes, analogies (from cat 10)
        - predictable_pairings_present       # formulaic adjective-noun combinations
        - proper_noun_deficit_present        # avoids real names, places, brands
        - cultural_specificity_deficit_present  # generic locations instead of specific places
      detection:
        any_3_of:
          - { check: specificity_score, threshold: 0.6, direction: "above", note: "high abstraction" }
          - { check: literary_device_count, threshold: 0, unit: "per 500 words", note: "zero literary devices" }
          - { check: predictable_pairing_density, threshold: 3, unit: "per 1000 words" }
          - { check: proper_noun_ratio, threshold: 0.5, unit: "per 1000 words", direction: "below" }
          - { check: cultural_reference_count, threshold: 0, note: "no specific cultural references" }
      rule: "AI writing achieves precision and consistency at the cost of richness -- it reads as competent but flat, missing the creative texture that human writers naturally provide through specific references, varied literary devices, and unpredictable word choices"
    rich_yet_shallow_pattern:
      description: "The vocabulary is rich and varied but lacks spontaneity and emotional depth"
      named_pattern: "Rich Yet Shallow"
      composite_checks:
        - high_lexical_diversity_present     # type-token ratio > 0.70
        - low_emotional_word_ratio           # emotional/sensory words < 2 per 1000
        - absence_of_spontaneous_language    # no colloquialisms or informal expressions
        - emotional_flatness_present         # sophisticated vocab but no expressed emotions
        - ornamental_vocabulary_present      # decorative rather than precise word use
      detection:
        all_of:
          - { check: lexical_diversity, threshold: 0.70, direction: "above" }
          - { check: emotional_word_ratio, threshold: 2, unit: "per 1000 words", direction: "below" }
        any_2_of:
          - { check: colloquialism_count, threshold: 0, note: "zero informal expressions" }
          - { check: emotion_expression_count, threshold: 0, note: "no joy, frustration, surprise, humor" }
          - { check: ornamental_vocab_density, threshold: 2, unit: "per 1000 words" }
      rule: "AI produces text with impressive vocabulary breadth that nonetheless feels hollow -- the words are varied but emotionally inert, creating a veneer of sophistication over shallow, impersonal content"

  # Sub-signal: Synonym Cycling / Elegant Variation
  # Avoiding natural word repetition by cycling through thesaurus synonyms
  synonym_cycling:
    description: "Systematically avoiding word repetition by rotating through synonyms for the same referent"
    detection_threshold:
      synonym_count: 4    # flag if 4+ different synonyms for same referent in 500 words
    examples:
      concept_cycling:
        - ["the framework", "the system", "the platform", "the solution", "the tool"]
        - ["the company", "the organization", "the firm", "the enterprise", "the business"]
        - ["the study", "the research", "the investigation", "the analysis", "the examination"]
        - ["the problem", "the issue", "the challenge", "the obstacle", "the difficulty"]
        - ["the method", "the approach", "the technique", "the strategy", "the methodology"]
    checks:
      referent_synonym_density:
        description: "Number of distinct synonyms used for the same referent within a 500-word window"
        threshold: 4       # flag if 4+ different terms for same entity
      natural_repetition_absence:
        description: "Zero natural word repetition for key concepts across 500+ words"
        threshold: 0       # flag if a key concept is never repeated -- always varied
    rule: "Human writers naturally repeat words -- saying 'the system' five times feels normal. AI rotates through synonyms like a thesaurus ('the system', 'the platform', 'the framework', 'the solution') because it optimizes for lexical diversity. The cycling itself is the signal."

# ==============================================================================
# Category 10: Mechanical Writing (weight: 0.12)
# ==============================================================================
mechanical_writing:
  weight: 0.12
  signal_strength: strong
  description: "Technically correct but rhythmically monotonous prose lacking literary devices and creative grammar"
  checks:
    sentence_length_uniformity:
      threshold: 0.20    # flag if variance within 20% of mean
    repetitive_openers:
      description: "Subject-Verb pattern every sentence"
    claim_evidence_conclusion:
      description: "Same paragraph structure repeated throughout"
    contraction_avoidance:
      human_patterns:
        - "we've"
        - "it's"
        - "they're"
        - "we're"
        - "don't"
        - "can't"
        - "won't"
        - "isn't"
        - "aren't"
        - "didn't"
        - "doesn't"
        - "shouldn't"
        - "couldn't"
        - "wouldn't"
      ai_patterns:
        - "we have"
        - "it is"
        - "they are"
        - "we are"
        - "do not"
        - "cannot"
        - "will not"
        - "is not"
        - "are not"
        - "did not"
        - "does not"
        - "should not"
        - "could not"
        - "would not"
    grammar_perfection:
      description: "No fragments, run-ons, 'And'/'But' openers"
      checks:
        - fragment_absence
        - run_on_absence
        - conjunction_opener_absence
    spelling_perfection:
      description: "Zero spelling errors (humans occasionally mistype)"
    american_english_only:
      description: "No British/regional spelling variation"
    literary_device_absence:
      description: "No metaphors, similes, analogies, personification, alliteration, or other literary devices"
      checks:
        - simile_absence           # no "like a..." or "as ... as" comparisons
        - metaphor_absence         # no figurative language beyond cliches
        - personification_absence  # no attributing human qualities to abstract concepts naturally
        - alliteration_absence     # no sound-based word pairings
        - irony_absence            # no ironic or sardonic observations
        - imagery_absence          # no vivid sensory language (sight, sound, taste, touch, smell)
        - analogy_absence          # no extended comparisons to clarify ideas
      rule: "Human writing naturally incorporates literary devices; their total absence signals mechanical generation"
    creative_grammar_deficit:
      description: "Grammatically correct but lacking creative deviations typical of human writing"
      checks:
        - no_intentional_fragments        # humans use fragments for emphasis ("Not a chance.")
        - no_one_word_sentences           # "Exactly." "Never." "Why?"
        - no_parenthetical_asides         # humans insert (often witty) parenthetical commentary
        - no_dashes_for_interruption      # using dashes to mimic interrupted thought mid-sentence
        - no_ellipsis_for_trailing_off    # trailing thoughts with "..."
        - no_unconventional_capitalization # humans occasionally capitalize for EMPHASIS
        - no_sentence_inversion           # "Gone are the days..." or "Rarely does..."
      rule: "Correct grammar without any creative bending suggests automated generation"
    predictable_syntax:
      description: "Limited syntax variety favoring declarative sentences and repetitive structures"
      checks:
        declarative_dominance:
          description: "Over 85% of sentences are declarative (Subject-Verb-Object)"
          threshold: 0.85    # flag if > 85% declarative
        question_absence:
          description: "No rhetorical or genuine questions"
          threshold: 0        # flag if zero questions in 500+ word text
        exclamatory_absence:
          description: "No exclamatory or emphatic sentences"
        imperative_absence:
          description: "No imperative sentences or direct address"
        conditional_overuse:
          description: "Heavy reliance on if/then and conditional structures"
        inverted_sentence_absence:
          description: "No sentences beginning with adverbs, prepositional phrases, or dependent clauses"
          threshold: 0.10    # flag if < 10% of sentences use non-standard openers
      rule: "Natural writing mixes declarative, interrogative, exclamatory, and imperative sentences"
    complex_sentence_preference:
      description: "Preference for long, complex sentences with multiple subordinate clauses"
      checks:
        avg_clause_count:
          threshold: 2.5     # flag if average sentence has > 2.5 clauses
        max_simple_ratio:
          threshold: 0.20    # flag if < 20% of sentences are simple (one clause)
        subordinate_clause_density:
          description: "Excessive use of 'which', 'that', 'although', 'while', 'because', 'since', 'whereas'"
          threshold: 8       # per 1000 words; flag if > 8
      subordinating_conjunctions:
        - which
        - that
        - although
        - while
        - because
        - since
        - whereas
        - whereby
        - whenever
        - wherever
        - "in order to"
        - "so that"
        - "given that"
        - "provided that"
        - "assuming that"
      rule: "AI tends to produce uniformly complex sentences; humans mix simple and complex naturally"
    predictable_rhythm:
      description: "Consistent and predictable prosodic rhythm without natural variation"
      checks:
        syllable_uniformity:
          description: "Sentences with similar syllable counts and stress patterns"
        clause_length_uniformity:
          description: "Subordinate clauses of similar word counts"
          threshold: 0.25   # flag if clause length variance within 25% of mean
        cadence_repetition:
          description: "Same sentence-ending pattern (long clause -> short concluding clause) repeated"
        breath_pattern_absence:
          description: "No short sentences that provide natural breathing points"
          threshold: 0.10   # flag if < 10% of sentences are under 8 words
        paragraph_rhythm_uniformity:
          description: "Paragraphs that all follow the same build-up-then-conclude pattern"
      rule: "Human writing has natural rhythm variation; AI produces metronomic regularity"
    predictable_rhythm_pattern:
      description: "Syntax variety is minimal, leading to a consistent and predictable rhythm"
      named_pattern: "Predictable Rhythm"
      composite_checks:
        - declarative_dominance_present      # > 80% declarative sentences
        - clause_length_uniformity_present   # clause lengths within 25% of mean
        - breath_pattern_absence_present     # < 10% short sentences (under 8 words)
        - cadence_repetition_present         # same sentence-ending patterns
        - sentence_type_monotony_present     # < 3 different sentence types used
      detection:
        any_3_of:
          - { check: declarative_ratio, threshold: 0.80, direction: "above" }
          - { check: clause_length_variance, threshold: 0.25, direction: "below", note: "within 25% of mean" }
          - { check: short_sentence_ratio, threshold: 0.10, direction: "below", note: "under 8 words" }
          - { check: cadence_pattern_repetitions, threshold: 3, note: "same ending pattern 3+ times" }
          - { check: sentence_type_count, threshold: 3, direction: "below", note: "fewer than 3 types: declarative, interrogative, imperative, exclamatory" }
      rule: "AI writing falls into a rhythmic rut where every sentence follows the same syntactic template, creating a metronomic predictability that human readers sense even if they cannot articulate what feels off"
    thought_process_absence:
      description: "Zero human thought-process markers in the text"
      checks:
        hesitation_marker_absence:
          description: "No conversational hedges or filler words that signal thinking"
          patterns_absent:
            - "actually"
            - "I mean"
            - "sort of"
            - "kind of"
            - "well,"
            - "you know"
            - "honestly"
            - "look,"
            - "admittedly"
            - "to be fair"
          threshold: 0    # flag if zero in documents > 1000 words
        self_correction_absence:
          description: "No mid-thought corrections or rephrasing"
          patterns_absent:
            - "wait"
            - "actually, that's not"
            - "let me rephrase"
            - "put another way"
            - "what I mean is"
            - "in other words"
            - "to put it differently"
            - "or rather"
            - "I should clarify"
          threshold: 0    # flag if zero in documents > 1500 words
        digression_absence:
          description: "No tangential observations, asides, or mid-thought pivots"
          threshold: 0    # flag if zero digressions detected in documents > 2000 words
      rule: "Human writers leave traces of their thinking process -- hesitations, corrections, digressions. Their total absence signals generation, not composition."
    grammatical_informality_absence:
      description: "Zero common human grammatical informalities in long documents"
      checks:
        comma_splice_absence:
          description: "Zero comma splices -- common in natural fast-paced writing"
          threshold: 0    # flag if zero in documents > 1000 words
        preposition_ending_absence:
          description: "Zero sentences ending with prepositions"
          threshold: 0    # flag if zero in documents > 500 words
        split_infinitive_absence:
          description: "Zero split infinitives -- natural in human English"
          threshold: 0    # flag if zero in documents > 1000 words
        perfect_whom_usage:
          description: "Perfect whom/who distinction -- most humans default to 'who' even when 'whom' is correct"
          threshold: 1.0  # flag if 100% correct whom usage (and whom is used at all)
      rule: "The absence of ALL minor grammatical informalities in a long document is itself a detection signal -- even careful human writers occasionally comma-splice, end with prepositions, or split infinitives"
    perfect_grammar_zero_thought:
      description: "Flawless grammar combined with zero human thought-process markers"
      named_pattern: "Perfect Grammar + Zero Thought Markers"
      composite_checks:
        - grammar_perfection_present         # grammar score > 0.95
        - hesitation_marker_absence_present  # zero hesitation markers
        - self_correction_absence_present    # zero self-corrections
        - grammatical_informality_absence_present  # zero common informalities
      detection:
        all_of:
          - { check: grammar_perfection_score, threshold: 0.95, direction: "above" }
          - { check: hesitation_marker_count, threshold: 0, note: "zero hesitation markers" }
          - { check: self_correction_count, threshold: 0, note: "zero self-corrections" }
          - { check: grammatical_informality_count, threshold: 0, note: "zero comma splices, preposition endings, split infinitives" }
      rule: "This pattern is extremely strong: human writers who achieve perfect grammar still leave traces of their thinking in the text -- hesitations, corrections, informal constructions. Perfect grammar with zero thought markers is almost exclusively AI-generated."
    lacks_creative_grammar:
      description: "The grammatical structure is correct but lacks creative deviations typical of human writing"
      named_pattern: "Lacks Creative Grammar"
      composite_checks:
        - no_intentional_fragments_present
        - no_one_word_sentences_present
        - no_parenthetical_asides_present
        - no_dashes_for_interruption_present
        - no_ellipsis_for_trailing_off_present
        - no_sentence_inversion_present
        - no_unconventional_capitalization_present
      detection:
        all_of:
          - { check: grammar_perfection_score, threshold: 0.95, direction: "above", note: "near-perfect grammar" }
          - { check: creative_deviation_count, threshold: 0, note: "zero creative grammar deviations in entire document" }
        supporting:
          - { check: fragment_count, threshold: 0 }
          - { check: one_word_sentence_count, threshold: 0 }
          - { check: parenthetical_aside_count, threshold: 0 }
          - { check: dash_interruption_count, threshold: 0 }
          - { check: ellipsis_trailing_count, threshold: 0 }
          - { check: sentence_inversion_count, threshold: 0 }
      rule: "Human writers bend grammar for effect -- fragments for punch, inversions for emphasis, asides for personality. AI writes correct grammar uniformly, producing text that is technically flawless but creatively sterile"

# ==============================================================================
# Category 11: Repetitive Phrasing (weight: 0.08)
# ==============================================================================
repetitive_phrasing:
  weight: 0.08
  signal_strength: medium
  description: "Restating ideas in slightly different words"
  checks:
    not_only_but_also:
      pattern: "not only .+ but also"
      description: "Overuse of this construction"
    semantic_redundancy:
      description: "Same point restated in different words within 2-3 sentences"
    echo_phrasing:
      description: "Paragraph ending with variant of its opening"
    parallel_overuse:
      description: "By doing X, we can Y. By doing A, we can B."
    conclusion_body_overlap:
      threshold: 0.50    # semantic overlap with body text
    prompt_echo:
      description: "Repeatedly echoing the original topic/question"

# ==============================================================================
# Category 12: Speculative Focus (weight: 0.06)
# ==============================================================================
speculative_focus:
  weight: 0.06
  signal_strength: weak
  description: "Non-committal, hedge-everything language with excessive focus on potential outcomes and future implications"
  hedging_words:
    - might
    - could potentially
    - may
    - perhaps
    - arguably
    - possibly
    - conceivably
  vague_future:
    - "time will tell"
    - "remains to be seen"
    - "only time will reveal"
    - "the future will determine"
  non_committal:
    - "it depends"
    - "there are many factors"
    - "it could be argued"
    - "while we can't be certain"
    - "it's difficult to say"
    - "results may vary"
  speculative_hypothetical:
    description: "Excessive focus on potential outcomes and future implications rather than concrete present realities"
    patterns:
      - "has the potential to"
      - "could revolutionize"
      - "may reshape"
      - "might transform"
      - "promises to"
      - "stands to"
      - "is poised to"
      - "would likely"
      - "if implemented correctly"
      - "if leveraged properly"
      - "if harnessed effectively"
      - "the implications are"
      - "the ramifications could"
      - "this could pave the way"
      - "the possibilities are"
      - "what remains to be seen is"
      - "the question remains"
      - "only then will we"
    future_orientation:
      description: "Disproportionate focus on future implications vs. present analysis"
      threshold: 0.30    # flag if > 30% of sentences are future-oriented
      rule: "AI overemphasizes what might happen instead of analyzing what is happening"

# ==============================================================================
# Category 13: Conflicting Subtext (weight: 0.10)
# ==============================================================================
conflicting_subtext:
  weight: 0.10
  signal_strength: strong
  description: "Surface meaning contradicts implied meaning"
  checks:
    backhanded_praise:
      description: "Praise that reads as condescending or undermining"
      patterns:
        - "commendable, .+ however"
        - "impressive, .+ but"
        - "While .+ effort .+ results"
    qualifier_negation:
      description: "Qualifiers that negate the main clause"
      patterns:
        - "While impressive, this falls short"
        - "Although notable, it fails"
        - "Despite being .+, it lacks"
    mixed_signals:
      description: "this is great, however... patterns"
    tone_content_mismatch:
      description: "Upbeat language about serious topics or vice versa"
    compliment_criticism_sandwich:
      description: "Positive-negative-positive leaving ambiguous meaning"
    intent_implication_misalignment:
      description: "Statements whose implications contradict apparent intent"

# ==============================================================================
# Category 14: Detached Warmth (weight: 0.06)
# ==============================================================================
detached_warmth:
  weight: 0.06
  signal_strength: weak
  description: "Performative empathy without genuine emotional engagement"
  performative_empathy:
    - "understandably"
    - "it makes sense that"
    - "and that's okay"
    - "it's natural to feel"
    - "it's completely normal"
  false_intimacy:
    - "we all know"
    - "as we can all agree"
    - "we've all been there"
    - "we can all relate"
  hollow_reassurance:
    - "rest assured"
    - "you're not alone"
    - "don't worry"
    - "it will be okay"
  hollow_encouragement:
    - "keep pushing forward"
    - "you've got this"
    - "stay strong"
    - "believe in yourself"
    - "you can do it"
  generic_closings:
    - "every journey begins with a single step"
    - "the sky is the limit"
    - "the possibilities are endless"
    - "here's to new beginnings"

  # Sub-signal: Chatbot Artifacts
  # Conversational scaffolding from chatbot training bleeding into written text
  chatbot_artifacts:
    description: "Conversational chatbot phrases that should never appear in written documents"
    detection_threshold:
      density: 0          # flag ANY occurrence outside dialogue
    phrases:
      - "I hope this helps"
      - "I hope this helps!"
      - "Hope this helps"
      - "Let me know if you need anything"
      - "Let me know if you need anything else"
      - "Let me know if you have any questions"
      - "Happy to help"
      - "Happy to help!"
      - "Feel free to ask"
      - "Feel free to reach out"
      - "Don't hesitate to ask"
      - "Don't hesitate to reach out"
      - "Great question"
      - "Great question!"
      - "That's a great question"
      - "Glad you asked"
      - "I'd be happy to"
      - "I'm glad you asked"
      - "Is there anything else"
      - "Let me know if that makes sense"
      - "Does that make sense"
      - "Hope that clarifies"
      - "Let me break this down"
      - "Let me walk you through"
    rule: "These phrases are direct chatbot interaction artifacts from conversational fine-tuning. They never appear in genuine written documents (articles, essays, reports, stories). Any occurrence outside of quoted dialogue is a conclusive AI tell."

# ==============================================================================
# Cross-Category Meta-Patterns
# ==============================================================================
cross_category:
  monotonous_clause_complexity:
    description: "Complex clauses that do not vary in length or style"
    categories: [mechanical_writing, structural_patterns]
  grammar_perfection_holistic:
    description: "Expert human writers sometimes use non-textbook patterns"
    categories: [mechanical_writing, punctuation_style]
  style_tone_shifts:
    description: "Abrupt shifts where human text becomes AI or vice versa in mixed content"
    categories: [tone_voice, detached_warmth, mechanical_writing]
  assignment_agnostic:
    description: "Text so vague it could answer many different prompts"
    categories: [tone_voice, creativity_deficit, speculative_focus]
  technical_complexity_without_substance:
    description: "Complex sentence structures and advanced vocabulary masking shallow analysis"
    categories: [analytical_academic, creativity_deficit, mechanical_writing]
    checks:
      - "High subordinate clause count combined with low specificity"
      - "Technical jargon density inversely correlated with concrete examples"
      - "Rich vocabulary diversity with absence of emotional or sensory language"
  mechanical_fluency:
    description: "Text that reads fluently but lacks the unpredictability of human thought"
    categories: [mechanical_writing, transitions, creativity_deficit]
    checks:
      - "Perfectly smooth transitions between every paragraph"
      - "No digressions, asides, or tangential observations"
      - "No self-corrections or mid-thought pivots"
      - "No unexpected juxtapositions or surprising connections"
  syntax_monotony:
    description: "Uniform syntactic patterns creating predictable, metronomic prose"
    categories: [mechanical_writing, structural_patterns, repetitive_phrasing]
    checks:
      - "Declarative sentence dominance > 85%"
      - "Consistent clause count per sentence"
      - "Same sentence opener patterns repeated"
      - "No interrogative, exclamatory, or imperative variety"
  linear_argumentation:
    description: "All arguments follow perfectly linear claim-evidence-conclusion structure"
    named_pattern: "Linear Argumentation"
    categories: [structural_patterns, tone_voice, creativity_deficit]
    checks:
      counter_argument_absence:
        description: "No counter-arguments or alternative perspectives acknowledged in any argument"
        threshold: 0    # flag if zero across entire document
      self_correction_absence:
        description: "No mid-argument corrections, pivots, or reconsiderations"
        threshold: 0    # flag if zero
      non_linear_reasoning_absence:
        description: "No question-first, conclusion-first, or example-first reasoning patterns"
        threshold: 0    # flag if zero non-linear patterns
      argument_count_minimum:
        threshold: 3    # need at least 3 arguments to measure
    detection:
      all_of:
        - { check: counter_argument_count, threshold: 0, note: "zero counter-arguments" }
        - { check: self_correction_count, threshold: 0, note: "zero mid-argument corrections" }
        - { check: non_linear_pattern_count, threshold: 0, note: "zero non-linear reasoning" }
        - { check: argument_count, threshold: 3, direction: "above", note: "enough arguments to measure" }
    rule: "Human writers almost always acknowledge complexity -- even structured thinkers occasionally say 'but wait' or 'on second thought'. Perfectly linear argumentation across 3+ arguments signals AI generation."
  analogy_originality:
    description: "Assessment of metaphor and analogy originality"
    categories: [creativity_deficit]
    checks:
      cliche_only_analogies:
        description: "All metaphors drawn from the generic_metaphors cliche pool"
        threshold: 0.80    # flag if > 80% of analogies are from cliche list
      domain_crossing_absence:
        description: "No analogies that cross domains unexpectedly"
        threshold: 0       # flag if zero
      extended_analogy_absence:
        description: "No analogies developed across multiple sentences"
        threshold: 0       # flag if zero in documents > 1000 words
      cultural_specificity_absence:
        description: "No culturally specific or contextually unique comparisons"
        threshold: 0       # flag if zero
    scoring:
      originality_score: "0.0 (all cliches) to 1.0 (all original)"
      flag_threshold: 0.20    # flag if below and analogies are present
    rule: "Human writers create analogies from their lived experience -- surprising, domain-crossing, culturally specific comparisons. AI draws from a common pool of safe, generic metaphors."
  register_shift_absence:
    description: "Uniform formality register throughout the entire document"
    categories: [tone_voice, mechanical_writing]
    checks:
      formality_variance:
        description: "Variance in formality level across paragraphs"
        threshold: 0.15    # flag if formality variance below this (0-1 scale)
        min_document_length: 500    # words; only flag in substantial documents
      register_shift_count:
        description: "Number of transitions between formal and informal register"
        threshold: 0    # flag if zero shifts in documents > 500 words
    rule: "Human writers naturally shift between registers -- a technical explanation followed by a casual aside, a formal opening followed by a conversational body. Uniform register throughout signals AI's consistent tone-setting."
  mechanical_precision:
    description: "Precise and technical word choice prioritizes clarity and specificity, avoiding colloquial language"
    named_pattern: "Mechanical Precision"
    categories: [analytical_academic, creativity_deficit, mechanical_writing]
    checks:
      - "High formal vocabulary density with zero colloquialisms or informal expressions"
      - "Technical register maintained uniformly without any register shifts"
      - "Word choice consistently favors precision over personality"
      - "Absence of hedges, slang, contractions, or conversational markers"
      - "Every word serves a functional purpose -- no playful, decorative, or emotionally expressive language"
    detection:
      all_of:
        - { check: formal_vocabulary_density, threshold: 10, unit: "per 1000 words", direction: "above" }
        - { check: colloquialism_count, threshold: 0, note: "zero informal expressions in entire document" }
        - { check: register_shift_count, threshold: 0, note: "no tonal or formality shifts" }
      any_1_of:
        - { check: contraction_count, threshold: 0, note: "zero contractions" }
        - { check: conversational_marker_count, threshold: 0, note: "no 'well', 'honestly', 'look', etc." }
    rule: "AI selects words like an optimizer -- maximizing clarity and information density while eliminating the colloquial roughness, playfulness, and personality that make human prose feel alive"
  sophisticated_clarity:
    description: "Precise word choice prioritizes clarity and sophistication, sometimes affecting natural flow"
    named_pattern: "Sophisticated Clarity"
    categories: [tone_voice, mechanical_writing, creativity_deficit]
    checks:
      - "High reading level (grade 12+) with uniformly sophisticated vocabulary"
      - "Text reads clearly but lacks conversational naturalness"
      - "No rhythm variation -- sophistication maintained at cost of flow"
      - "Absence of simple, punchy sentences that would break the sophisticated register"
      - "Every sentence constructed for maximum informational clarity, sacrificing the meandering, digressive quality of natural thought"
    detection:
      all_of:
        - { check: reading_grade_level, threshold: 12, direction: "above" }
        - { check: vocabulary_sophistication_score, threshold: 0.75, direction: "above" }
        - { check: conversational_element_count, threshold: 0, note: "no informal register elements" }
      any_2_of:
        - { check: short_sentence_ratio, threshold: 0.10, direction: "below", note: "fewer than 10% short sentences" }
        - { check: rhythm_variance, threshold: 0.20, direction: "below", note: "low rhythm variation" }
        - { check: digression_count, threshold: 0, note: "no asides, tangents, or self-corrections" }
    rule: "AI writes with a uniform sophistication that prioritizes reader comprehension over natural expression, producing text that is clear and polished but lacks the organic flow of a human mind moving between registers, pausing to reconsider, or choosing a simple word when a complex one would technically be more precise"
  perplexity_analysis:
    description: "Low text perplexity indicates AI-generated content due to high-probability token selection"
    categories: [vocabulary_tells, creativity_deficit, mechanical_writing]
    checks:
      vocabulary_surprise:
        description: "Proportion of word choices that are unexpected given context"
        threshold: 0.30    # flag if below -- low surprise = AI
        scale: "0.0 (completely predictable) to 1.0 (completely unpredictable)"
      ngram_novelty:
        description: "Proportion of 3-grams not in common language corpora"
        threshold: 0.15    # flag if below
      transition_unpredictability:
        description: "Variance in semantic distance between consecutive sentences"
        threshold: 0.20    # flag if below -- low variance = AI
    scoring:
      method: "average of vocabulary_surprise, ngram_novelty, transition_unpredictability"
      weight: 0.08
      signal_strength: strong
    rule: "AI selects high-probability tokens, producing text with low perplexity -- predictable word choices, common n-grams, and smooth semantic transitions. Human text is messier: unexpected words, novel phrases, and jarring transitions between ideas."
  burstiness_analysis:
    description: "Low burstiness (uniform complexity) indicates AI-generated content"
    categories: [mechanical_writing, structural_patterns, creativity_deficit]
    checks:
      sentence_complexity_variance:
        description: "Variance in sentence complexity (clause count, word count) across 500-word windows"
        threshold: 0.25    # flag if below -- low variance = AI
        window_size: 500   # words
      paragraph_readability_variance:
        description: "Variance in Flesch-Kincaid readability scores across paragraphs"
        threshold: 8.0     # flag if standard deviation below this value across paragraphs
      perplexity_standard_deviation:
        description: "Standard deviation of perplexity scores across document sections"
        threshold: 0.15    # flag if below
    scoring:
      method: "weighted average: sentence_complexity_variance (0.4), paragraph_readability_variance (0.3), perplexity_std_dev (0.3)"
      weight: 0.08
      signal_strength: strong
    rule: "Human writing is bursty -- alternating between simple directness and elaborate complexity. AI maintains a uniform register, producing text where every passage reads at roughly the same difficulty level. Low burstiness is one of the most reliable AI signals."
  low_perplexity_low_burstiness:
    description: "Document is both predictable (low perplexity) and uniform (low burstiness)"
    named_pattern: "Low Perplexity + Low Burstiness"
    categories: [vocabulary_tells, mechanical_writing, creativity_deficit, structural_patterns]
    detection:
      all_of:
        - { check: perplexity_score, threshold: 0.30, direction: "below", note: "document-level perplexity" }
        - { check: burstiness_score, threshold: 0.25, direction: "below", note: "complexity uniformity" }
    rule: "The strongest composite AI signal: text that is both word-by-word predictable and paragraph-by-paragraph uniform. Human writing is almost never both -- even formulaic human writing has complexity bursts, and even predictable human vocabulary has moments of surprise."
  lix_analysis:
    description: "LIX readability uniformity indicates AI-generated content"
    categories: [mechanical_writing, structural_patterns]
    formula: "(words / sentences) + (long_words * 100 / words)"
    long_word_threshold: 7    # characters; words with 7+ chars are "long"
    lix_scale:
      very_easy: { max: 25, label: "Children's books" }
      easy: { min: 25, max: 35, label: "Fiction, popular press" }
      medium: { min: 35, max: 45, label: "Newspapers, magazines" }
      difficult: { min: 45, max: 55, label: "Academic, professional" }
      very_difficult: { min: 55, label: "Legal, technical, specialist" }
    checks:
      lix_uniformity:
        description: "LIX scores are uniform across document sections"
        threshold: 5.0    # flag if standard deviation of per-section LIX is below this
        min_sections: 3   # need at least 3 sections to measure
        signal_strength: medium
      lix_range:
        description: "Difference between highest and lowest section LIX scores"
        threshold: 10.0   # flag if range < 10 (human text typically has range > 15)
    scoring:
      weight: 0.06
      signal_strength: medium
    rule: "AI produces text at a consistent complexity level -- every section reads at roughly the same difficulty. Human writers naturally shift between accessible and challenging prose, producing high LIX variance across sections."
  uniform_lix:
    description: "LIX readability is uniform across all document sections"
    named_pattern: "Uniform LIX"
    categories: [mechanical_writing, structural_patterns]
    detection:
      all_of:
        - { check: lix_std_deviation, threshold: 5.0, direction: "below", note: "low section-to-section variation" }
        - { check: section_count, threshold: 3, direction: "above", note: "enough sections to measure" }
      supporting:
        - { check: lix_range, threshold: 10.0, direction: "below", note: "narrow overall range" }
    rule: "Human writing shows LIX variability -- an easy introductory section, a dense analytical middle, a punchy conclusion. AI maintains a uniform reading level throughout, like a thermostat holding a steady temperature."

# ==============================================================================
# Detection Report Schema
# ==============================================================================
report_schema:
  metadata:
    - document          # path to scanned file
    - timestamp         # ISO 8601
    - word_count        # total words
    - sensitivity_profile  # per-category sensitivity levels

  overall_score: "float 0.0-1.0 (0=human, 1=AI)"
  verdict: "low_ai_likelihood | moderate_ai_likelihood | high_ai_likelihood"

  category_scores:
    _each:
      - score           # 0.0-1.0
      - weight          # raw weight from config
      - findings_count  # number of findings in this category

  findings:
    _each:
      - id              # F-001, F-002, ...
      - category        # category key
      - line            # line number in document
      - col             # column number
      - text            # matched text
      - pattern         # pattern name
      - severity        # low | medium | high
      - confidence      # 0.0-1.0
      - suggestion      # rewrite suggestion
      - context         # sentence | paragraph | section
      - subtext_analysis  # (category 13 only) surface_meaning, implied_meaning, conflict_type

  summary:
    - strongest_signals    # top categories by score
    - total_findings       # total count
    - high_severity        # count
    - medium_severity      # count
    - low_severity         # count
    - rewrite_priority     # ordered list of categories for rewriter

# ==============================================================================
# False Positive Filtering
# ==============================================================================
false_positive_filters:
  skip_file_patterns:
    - "*.test.js"
    - "*.test.ts"
    - "*.spec.js"
    - "*.spec.ts"
    - "*.test.py"
    - "*_test.go"
    - "*.md"           # documentation may intentionally use some patterns
    - "README*"
    - "CHANGELOG*"
    - "LICENSE*"
    - "package-lock.json"
    - "yarn.lock"
  skip_content_patterns:
    - code_blocks       # fenced code blocks (```)
    - inline_code       # backtick-wrapped content
    - urls              # hyperlinks
    - file_paths        # /path/to/file patterns
  context_adjustments:
    academic_papers:
      analytical_academic: { threshold_multiplier: 2.0 }
      qualifiers_softening: { threshold_multiplier: 1.5 }
    creative_fiction:
      vocabulary_tells: { threshold_multiplier: 0.5 }
      creativity_deficit: { threshold_multiplier: 0.7 }
    technical_docs:
      structural_patterns: { threshold_multiplier: 2.0 }
      mechanical_writing: { threshold_multiplier: 1.5 }
