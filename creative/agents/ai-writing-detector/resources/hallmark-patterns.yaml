# AI Writing Hallmark Patterns
# Used by ai-writing-detector to scan documents for AI writing characteristics.
# 14 categories with full word/phrase lists, weights, and sensitivity defaults.
#
# Weight normalization: raw weights sum to 1.16; divide each by 1.16 at runtime.

scoring:
  weight_sum: 1.38    # 1.16 (14 categories) + 0.08 (perplexity) + 0.08 (burstiness) + 0.06 (LIX)
  verdicts:
    low_ai_likelihood: { max: 0.3 }
    moderate_ai_likelihood: { min: 0.3, max: 0.6 }
    high_ai_likelihood: { min: 0.6 }

sensitivity_defaults:
  vocabulary_tells: medium
  analytical_academic: medium
  punctuation_style: medium
  structural_patterns: medium
  ai_phrases: medium
  transitions: medium
  qualifiers_softening: medium
  tone_voice: medium
  creativity_deficit: medium
  mechanical_writing: medium
  repetitive_phrasing: medium
  speculative_focus: medium
  conflicting_subtext: medium
  detached_warmth: medium

sensitivity_thresholds:
  low:
    min_confidence: 0.85
    min_severity: high
  medium:
    min_confidence: 0.50
    min_severity: low
  high:
    min_confidence: 0.30
    min_severity: low

