  # Sub-signal: Copula Avoidance
  # AI avoids direct "is/are" in favor of circumlocutions
  copula_avoidance:
    description: "Circumlocuting simple 'is/are' copulas with elaborate constructions"
    detection_threshold:
      density: 3          # 3+ per 1000 words
    phrases:
      - "serves as"
      - "stands as"
      - "acts as"
      - "functions as"
      - "represents a"
      - "operates as"
      - "works as a"
      - "serves as a"
      - "stands as a"
      - "acts as a"
      - "remains a"
      - "constitutes a"
      - "proves to be"
      - "emerges as"
    rule: "AI avoids the copula ('is/are') because instruction tuning rewards elaborate, 'helpful' phrasing. 'X serves as Y' instead of 'X is Y' is a consistent AI stylistic tic."

  # Sub-signal: Knowledge-Cutoff Disclaimers
  # Temporal hedges revealing model self-awareness
  knowledge_cutoff_disclaimers:
    description: "Phrases revealing AI model awareness of training data limitations"
    detection_threshold:
      density: 0          # flag ANY occurrence -- these are direct provenance markers
    phrases:
      - "as of my last update"
      - "as of my last training"
      - "as of my knowledge cutoff"
      - "I don't have access to real-time"
      - "I don't have real-time"
      - "I cannot access real-time"
      - "as of my training data"
      - "I was last updated"
      - "my training data goes up to"
      - "based on my training"
      - "I'm not able to browse"
      - "I can't browse the internet"
      - "as of [year]"
      - "at the time of this writing"
    rule: "These are direct AI provenance markers -- no human writer references training data cutoffs. Any occurrence is conclusive."

  # Sub-signal: Superficial -ing Analyses
  # Present-participle phrases that gesture at analysis without performing it
  superficial_ing_analyses:
    description: "Present-participle constructions performing shallow gestural analysis"
    detection_threshold:
      density: 3          # 3+ per 1000 words
    phrases:
      - "highlighting the importance"
      - "highlighting the need"
      - "showcasing the"
      - "underscoring the"
      - "underscoring the significance"
      - "demonstrating the value"
      - "demonstrating the importance"
      - "illustrating the"
      - "emphasizing the need"
      - "emphasizing the importance"
      - "reflecting the"
      - "representing a"
      - "signaling a"
      - "pointing to the"
      - "revealing the"
    rule: "These -ing constructions substitute for actual analysis. Instead of explaining WHY something is important, AI gestures at importance with a present participle. Human analysts explain; AI highlights."

  # Sub-signal: False Ranges
  # "From X to Y" used rhetorically, not as actual ranges
  false_ranges:
    description: "Rhetorical 'from X to Y' constructions that are not actual ranges"
    detection_threshold:
      density: 2          # 2+ per 1000 words
    patterns:
