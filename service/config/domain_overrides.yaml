# Service domain overrides
domain: service
description: "Customer support, CX, legal, compliance, and governance"

planner:
  controller_catalog:
    tier_2: [customer-success-manager, general-counsel, account-manager, support-operations-manager]
    tier_3: [support-director, general-counsel, compliance-officer, legal-operations-manager, relationship-manager]
    tier_4: [general-counsel, support-director, compliance-officer, customer-advocacy-manager]

  specialist_routing:
    legal:
      keywords: [legal, lawsuit, contract, IP, patent, trademark, litigation, corporate law]
      agents: [general-counsel]
      description: "Legal matters routed to general counsel"
    compliance:
      keywords: [compliance, audit, SOC2, HIPAA, risk, policy, governance]
      agents: [compliance-officer, compliance-specialist]
      description: "Compliance monitoring and audit support"
    support:
      keywords: [support, ticket, escalation, help desk, CSAT, chat support]
      agents: [support-director]
      description: "Customer support operations"
    legal_corporate:
      keywords: [corporate law, M&A, securities, entity, incorporation]
      agents: [corporate-counsel]
      description: "Corporate law and M&A"
    legal_ip:
      keywords: [patent, trademark, copyright, trade secret, licensing, IP]
      agents: [ip-attorney]
      description: "Intellectual property law"
    legal_employment:
      keywords: [employment law, labor law, workplace, wrongful termination, discrimination]
      agents: [employment-attorney]
      description: "Employment and labor law"
    litigation:
      keywords: [lawsuit, litigation, discovery, settlement, trial, dispute]
      agents: [litigation-manager]
      description: "Litigation management and dispute resolution"
    contracts:
      keywords: [contract, agreement, NDA, MSA, terms, negotiation]
      agents: [contracts-manager]
      description: "Contract drafting and negotiation"
    privacy:
      keywords: [privacy, GDPR, CCPA, data protection, PII, consent]
      agents: [privacy-officer]
      description: "Privacy and data protection"
    regulatory:
      keywords: [regulatory, regulation, FDA, FCC, submission, agency]
      agents: [regulatory-affairs-specialist]
      description: "Regulatory affairs and submissions"
    customer_support:
      keywords: [ticket, help desk, customer issue, troubleshoot, support queue]
      agents: [customer-support-rep, technical-support-engineer, chat-support-specialist]
      description: "Frontline customer support"
    escalation:
      keywords: [escalation, critical issue, P1, outage, incident, urgent]
      agents: [escalation-manager]
      description: "Escalation and critical issue management"
    knowledge_base:
      keywords: [knowledge base, FAQ, documentation, self-service, help article]
      agents: [knowledge-base-manager, technical-writer]
      description: "Knowledge base and self-service content"
    support_training:
      keywords: [support training, agent coaching, onboarding support, skills]
      agents: [support-trainer, support-quality-analyst]
      description: "Support team training and quality"
    account_management:
      keywords: [account, renewal, upsell, cross-sell, retention, churn prevention]
      agents: [account-manager, customer-advocacy-manager]
      description: "Account management and retention"
    customer_education:
      keywords: [tutorial, webinar, certification, customer training, academy]
      agents: [customer-education-specialist]
      description: "Customer education and training programs"
    customer_success:
      keywords: [customer success, onboarding, adoption, health score, NPS]
      agents: [customer-success-manager, relationship-manager]
      description: "Customer success and relationship management"
    legal_operations:
      keywords: [legal ops, legal technology, matter management, legal budget]
      agents: [legal-operations-manager]
      description: "Legal operations and technology"
    legal_research:
      keywords: [legal research, case law, precedent, due diligence, legal analysis]
      agents: [legal-analyst, paralegal]
      description: "Legal research and analysis"
    risk_compliance:
      keywords: [risk management, compliance risk, enterprise risk, control framework]
      agents: [risk-and-compliance-manager]
      description: "Risk and compliance management"
    support_analytics:
      keywords: [support metrics, CSAT, first response, resolution time, support data]
      agents: [support-analyst]
      description: "Support analytics and metrics"
    support_operations:
      keywords: [support process, queue management, routing, SLA, support workflow]
      agents: [support-operations-manager, support-supervisor]
      description: "Support operations and process management"
    community:
      keywords: [community, forum, user group, community engagement, ambassador]
      agents: [community-manager]
      description: "Community management and engagement"

