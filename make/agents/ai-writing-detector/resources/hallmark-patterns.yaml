# ==============================================================================
# Category 2: Analytical/Academic Words (weight: 0.08)
# ==============================================================================
analytical_academic:
  weight: 0.08
  signal_strength: medium
  description: "Overly formal connectives and academic vocabulary uncommon in natural prose"
  detection_threshold:
    density: 5    # per 1000 words; 1-2 is normal academic writing
  patterns:
    - furthermore
    - moreover
    - consequently
    - subsequently
    - thereby
    - wherein
    - hitherto
    - notwithstanding
    - juxtaposition
    - dichotomy
    - extrapolate
    - elucidate
    - delineate
    - contextualize
    - posit
    - ascertain
    - predicated
    - promulgate
    - advancements
    - implications
    - paradigm
    - synergy

# ==============================================================================
# Category 3: Punctuation/Style Tics (weight: 0.08)
# ==============================================================================
punctuation_style:
  weight: 0.08
  signal_strength: medium
  description: "Characteristic punctuation patterns of AI-generated text"
  checks:
    em_dash_overuse:
      description: "AI uses em dashes for explanatory clauses and dramatic pauses"
      threshold: 2      # per 500 words
      pattern: "---?|\\u2014"
    colon_list_patterns:
      description: "Colon followed by list structure"
      patterns:
        - "Here are the key"
        - "Here's what"
        - "Consider the following"
        - "The main points are:"
        - "Key takeaways:"
        - "Important considerations:"
    oxford_comma_consistency:
      description: "AI uses Oxford commas 100% consistently"
      threshold: 1.0    # flag if every serial comma uses Oxford
    semicolon_absence:
      description: "AI rarely uses semicolons unlike human academic writing"
      threshold: 0       # per 1000 words; flag if zero
    perfect_punctuation:
      description: "No creative use of ellipsis, fragments, unconventional punctuation"
      patterns_absent:
        - "..."
        - sentence_fragments
        - exclamation_clusters

# ==============================================================================
# Category 4: Structural Patterns (weight: 0.12)
# ==============================================================================
structural_patterns:
  weight: 0.12
  signal_strength: strong
  description: "Formulaic document organization typical of AI output"
  checks:
    formulaic_headers:
      patterns:
        - "## Introduction"
        - "## Key Takeaways"
        - "## Conclusion"
        - "## Summary"
        - "## Overview"
        - "## Background"
        - "## Key Points"
        - "## Final Thoughts"
    excessive_lists:
      threshold: 0.40    # flag if > 40% content in lists
    conclusion_patterns:
      patterns:
        - "In conclusion"
        - "To summarize"
        - "In summary"
        - "Overall,"
        - "To sum up"
        - "In closing"
        - "To wrap up"
    paragraph_uniformity:
      threshold: 0.20    # flag if all paragraphs within 20% of average length
    three_point_pattern:
      description: "Everything in groups of three"
    mid_essay_bullets:
      description: "Bullet lists appearing where flowing prose is more natural"
    long_conclusions:
      description: "Conclusions that repeat most of the content"
      overlap_threshold: 0.50  # flag if > 50% semantic overlap with body

