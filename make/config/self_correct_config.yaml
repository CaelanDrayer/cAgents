super_domain: make
description: Self-correction patterns for MAKE super-domain
recovery_patterns:
  coordination_failures:
  - failure: Insufficient questions asked
    recovery: Ask follow-up questions to clarify
  - failure: Synthesis lacks coherence
    recovery: Re-synthesize with focus on consistency
  execution_failures:
  - failure: Task incomplete
    recovery: Identify blocking issue and resolve
  - failure: Tests failing
    recovery: Analyze test failures, fix implementation, re-run tests
  - failure: Build errors
    recovery: Check dependencies, fix compilation issues
  validation_failures:
  - failure: Quality gate failed
    recovery: Address specific failure and re-validate
  - failure: Code coverage insufficient
    recovery: Add missing tests for uncovered paths
  - failure: Security scan found vulnerabilities
    recovery: Patch vulnerabilities and re-scan
