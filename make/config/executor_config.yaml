super_domain: make
description: Execution monitoring for MAKE super-domain
monitoring_patterns:
  controller_tracking:
    coordination_log_required: true
    progress_indicators:
    - questions_asked
    - answers_received
    - synthesis_complete
    - tasks_created
  completion_criteria:
  - All questions answered
  - Synthesis documented
  - Tasks completed
  - coordination_log.yaml exists
  domain_specific_monitoring:
  - Code compilation and build success
  - Test suite execution results
  - Creative deliverable quality review
