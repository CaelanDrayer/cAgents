# Science domain overrides
domain: science
description: "STEM research, scientific analysis, mathematics, and data interpretation"

planner:
  controller_catalog:
    tier_2: [science-coordinator]
    tier_3: [science-coordinator]
    tier_4: [science-coordinator]

  specialist_routing:
    mathematics:
      keywords: [math, mathematics, calculus, algebra, theorem, proof, equation, formula]
      agents: [mathematician]
      description: "Pure and applied mathematics, proofs, and mathematical modeling"
    physics:
      keywords: [physics, quantum, gravity, entropy, thermodynamics, mechanics, relativity]
      agents: [physicist]
      description: "Physics analysis, experiment design, and physical phenomena"
    chemistry:
      keywords: [chemistry, molecule, atom, periodic, reaction, synthesis, spectroscopy]
      agents: [chemist]
      description: "Chemistry problems, synthesis planning, and lab procedures"
    biology:
      keywords: [biology, genetics, evolution, genome, photosynthesis, cell, physiology]
      agents: [biologist]
      description: "Biology analysis, genetics, evolutionary biology, and lab methods"
    statistics:
      keywords: [statistics, hypothesis, data analysis, regression, inference, probability]
      agents: [statistician]
      description: "Statistical analysis, experimental design, and data interpretation"
    astronomy:
      keywords: [astronomy, celestial, stellar, cosmology, planetary, astrophysics]
      agents: [astronomer]
      description: "Astronomy and astrophysics, observational techniques, and cosmology"
    geology:
      keywords: [geology, mineral, geomorphology, soil, plate tectonics, rock]
      agents: [geoscientist]
      description: "Geoscience problems, geological hazards, and earth processes"
    biochemistry:
      keywords: [biochemistry, protein, enzyme, metabolic, molecular biology]
      agents: [biochemist]
      description: "Biochemistry, molecular biology, and protein structure analysis"
    ecology:
      keywords: [ecology, ecosystem, biodiversity, conservation, population dynamics, climate]
      agents: [ecologist]
      description: "Ecology, conservation planning, and ecosystem analysis"

router:
  keywords:
    - physics
    - chemistry
    - biology
    - math
    - mathematics
    - calculus
    - algebra
    - theorem
    - proof
    - hypothesis
    - experiment
    - research
    - laboratory
