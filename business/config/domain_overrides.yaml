# Business domain overrides
domain: business
description: "Strategy, product management, operations, finance, marketing, sales, and business execution"

planner:
  controller_catalog:
    tier_2: [operations-manager, product-owner, project-manager, game-designer]
    tier_3: [strategic-planner, finance-manager, program-manager, business-analyst, quality-manager, game-producer, supply-chain-manager]
    tier_4: [cpo, cfo, strategic-planner, operations-manager]

  specialist_routing:
    game_development:
      keywords: [game, game design, game mechanics, game balance, level design, game system]
      agents: [game-designer, game-producer]
      description: "Game design and production coordination (cross-domain: game-programmer in engineering/, game-writer in creative/)"
    agile:
      keywords: [agile, scrum, sprint, kanban, velocity, retrospective, standup]
      agents: [agile-coach]
      description: "Agile coaching and scrum facilitation"
    okr:
      keywords: [OKR, objective, key result, goal setting, quarterly planning]
      agents: [okr-specialist]
      description: "OKR and goal-setting frameworks"
    project_management:
      keywords: [project, milestone, timeline, deliverable, Gantt, WBS]
      agents: [project-manager]
      description: "Project management and delivery"
    program_management:
      keywords: [program, portfolio, initiative, cross-project, PMO]
      agents: [program-manager, portfolio-manager]
      description: "Program and portfolio management"
    risk:
      keywords: [risk, mitigation, contingency, business continuity, disaster recovery]
      agents: [risk-manager, scenario-planner]
      description: "Risk management and scenario planning"
    procurement:
      keywords: [procurement, vendor, sourcing, RFP, supplier, contract negotiation]
      agents: [procurement-specialist]
      description: "Procurement and vendor management"
    process:
      keywords: [process improvement, lean, six sigma, kaizen, efficiency, automation]
      agents: [process-improvement-specialist]
      description: "Process improvement and optimization"
    facilities:
      keywords: [facilities, office, workspace, maintenance, safety, building]
      agents: [facilities-manager]
      description: "Facilities and workspace management"
    finance:
      keywords: [budget, forecast, P&L, revenue, expense, financial model, ROI]
      agents: [finance-manager]
      description: "Financial planning and analysis"
    data_analytics:
      keywords: [dashboard, report, analytics, BI, business intelligence, data visualization]
      agents: [business-analyst]
      description: "Business analytics and reporting (cross-domain: bi-specialist in shared/)"
    research:
      keywords: [market research, competitive analysis, industry analysis, benchmarking]
      agents: [business-researcher]
      description: "Business and market research"
    planning:
      keywords: [strategic planning, roadmap, long-term plan, multi-year, vision]
      agents: [strategic-planner, roadmap-planner]
      description: "Strategic planning and roadmapping"
    resource:
      keywords: [resource allocation, capacity planning, staffing, utilization]
      agents: [resource-planner]
      description: "Resource allocation and capacity planning"
    quality:
      keywords: [quality, ISO, Six Sigma, DMAIC, quality audit, process quality]
      agents: [quality-manager]
      description: "Quality management and process quality"
    supply_chain:
      keywords: [supply chain, inventory, logistics, warehouse, fulfillment]
      agents: [supply-chain-manager]
      description: "Supply chain and logistics management"
    change_management:
      keywords: [change management, transformation, adoption, organizational change, transition]
      agents: [change-management-specialist]
      description: "Change management and organizational transformation"
    performance:
      keywords: [performance metrics, KPI, balanced scorecard, performance review, benchmarking]
      agents: [performance-analyst]
      description: "Performance analysis and KPI tracking"
    process_audit:
      keywords: [process audit, compliance audit, internal audit, gap analysis, assessment]
      agents: [process-auditor]
      description: "Process auditing and gap analysis"
    business_development:
      keywords: [business development, partnership, strategic alliance, expansion, new market]
      agents: [business-development-manager]
      description: "Business development and strategic partnerships"
    product:
      keywords: [product, backlog, user story, feature, product requirements, PRD]
      agents: [product-owner]
      description: "Product ownership and backlog management"
    operations:
      keywords: [operations, operational efficiency, workflow, standard operating procedure, SOP]
      agents: [operations-manager]
      description: "Operations management"
    planning_ops:
      keywords: [planning operations, planning cycle, planning process, forecasting]
      agents: [planning-operations-manager, planning-analyst, planning-facilitator]
      description: "Planning operations and facilitation"
    predictive:
      keywords: [prediction, forecasting model, trend analysis, predictive analytics, simulation]
      agents: [predictive-analyst, scenario-planner]
      description: "Predictive analytics and scenario modeling"
    documentation:
      keywords: [documentation, decision log, knowledge capture, technical writing, meeting notes]
      agents: [scribe]
      description: "Documentation and knowledge capture"

