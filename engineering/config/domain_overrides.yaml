# Engineering domain overrides
domain: engineering
description: "Software engineering, infrastructure, security, QA, and game programming"

planner:
  controller_catalog:
    tier_2: [tech-lead, qa-lead]
    tier_3: [tech-lead, architect, security-lead, backend-lead, frontend-lead, data-lead]
    tier_4: [cto, tech-lead, architect, infrastructure-lead, vp-engineering]

  specialist_routing:
    frontend:
      keywords: [frontend, UI, UX, component, CSS, styling, responsive, design system, wireframe, accessibility]
      agents: [frontend-lead]
      description: "Frontend architecture and UI/UX coordination"
    backend:
      keywords: [backend, API, database, server, microservice, REST, GraphQL]
      agents: [backend-lead]
      description: "Backend architecture and API coordination"
    data:
      keywords: [data pipeline, ETL, data warehouse, analytics, data model]
      agents: [data-lead]
      description: "Data engineering and pipeline coordination"
    devops:
      keywords: [CI/CD, pipeline, Docker, container, Kubernetes, deploy, terraform, ansible, cloud, AWS, GCP, Azure]
      agents: [infrastructure-lead]
      description: "DevOps and infrastructure coordination"
    game_programming:
      keywords: [game programming, game engine, gameplay, physics engine, Unity, Unreal, Godot, shader, rendering]
      agents: [tech-lead]
      description: "Game programming routed through tech-lead to game-programmer"
    security:
      keywords: [security, vulnerability, penetration, OWASP, CVE, threat, authentication security]
      agents: [security-lead, security-engineer]
      description: "Security assessment, vulnerability analysis, and threat modeling"
    testing:
      keywords: [test, QA, quality assurance, unit test, integration test, e2e, coverage]
      agents: [qa-lead]
      description: "Testing strategy, QA coordination, and coverage analysis"
    architecture:
      keywords: [architecture, system design, patterns, microservice, monolith, event-driven]
      agents: [architect]
      description: "System architecture and design pattern guidance"
    code_review:
      keywords: [code review, PR review, pull request, review code]
      agents: [code-reviewer]
      description: "Code review and pull request evaluation"
    database:
      keywords: [database, schema, migration, query optimization, SQL, NoSQL, index]
      agents: [dba]
      description: "Database design, schema management, and query optimization"
    performance:
      keywords: [performance, optimize, profiling, bottleneck, latency, throughput]
      agents: [performance-analyzer]
      description: "Performance profiling, bottleneck identification, and optimization"

router:
  keywords:
    - fix
    - bug
    - implement
    - code
    - api
    - database
    - build
    - refactor
    - test
    - deploy
    - backend
