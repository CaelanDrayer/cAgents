    - migration
    - CI/CD
    - pipeline  # intentional cross-domain: CI/CD pipeline (engineering/) vs sales pipeline (growth/)
    - Docker
    - container
    - Kubernetes
    - cloud
    - AWS
    - GCP
    - Azure
    - performance
