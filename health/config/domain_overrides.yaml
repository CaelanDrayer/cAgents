# Health domain overrides
domain: health
description: "Medical information, wellness, fitness, nutrition, and mental health support"

planner:
  controller_catalog:
    tier_2: [health-coordinator]
    tier_3: [health-coordinator, medical-advisor]
    tier_4: [health-coordinator, medical-advisor, mental-health-advisor]

  specialist_routing:
    medicine:
      keywords: [medical, diagnosis, treatment, symptoms, clinical, cardiology, oncology, neurology, anatomy, physiology, prognosis]
      agents: [medical-advisor]
      description: "Clinical medicine information, symptom analysis, and treatment research"
    mental_health:
      keywords: [mental health, therapy, counseling, mindfulness, stress, sleep, anxiety, depression, CBT, DBT]
      agents: [mental-health-advisor]
      description: "Mental health education, coping strategies, and therapy modality overviews"
    nutrition:
      keywords: [nutrition, diet, calories, vitamins, supplements, meal plan, macronutrient]
      agents: [nutritionist]
      description: "Meal planning, dietary analysis, and sports nutrition"
    fitness:
      keywords: [fitness, exercise, workout, strength, conditioning, rehabilitation]
      agents: [fitness-coach]
      description: "Exercise programming, workout design, and injury prevention"
    pharmacy:
      keywords: [pharmacy, medication, dosage, drug interaction, prescription, OTC, vaccine]
      agents: [pharmacist]
      description: "Medication counseling, drug interactions, and dosage guidance"

router:
  keywords:
    - medical
    - health
    - wellness
    - fitness
    - nutrition
    - mental health
    - therapy
