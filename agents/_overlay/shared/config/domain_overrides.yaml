# Shared domain overrides
# Cross-domain intelligence, data science, and market analysis specialists
domain: shared
description: "Cross-domain intelligence and data specialists"

planner:
  controller_catalog:
    tier_2: [data-scientist]
    tier_3: [data-scientist, market-research-analyst]

  specialist_routing:
    business_intelligence:
      keywords: [business intelligence, BI, dashboard, data visualization, KPI, metrics, reporting, analytics dashboard]
      agents: [data-scientist]
      description: "Business intelligence, dashboards, KPI tracking, and data visualization"
    data_science:
      keywords: [data science, machine learning, ML, statistical analysis, predictive, forecasting, modeling, regression, classification, clustering, neural network, deep learning, NLP, A/B test, experiment analysis]
      agents: [data-scientist]
      description: "Data science, machine learning, statistical modeling, and experiment analysis"
    market_research:
      keywords: [market research, market analysis, segmentation, consumer insights, survey, focus group, market sizing, TAM, SAM, SOM]
      agents: [market-research-analyst]
      description: "Market research, consumer segmentation, and market sizing"
    competitive_intelligence:
      keywords: [competitive analysis, competitive intelligence, competitor, market positioning, SWOT, benchmarking, industry analysis]
      agents: [market-research-analyst]
      description: "Competitive intelligence, competitor analysis, and market positioning"

router:
  note: "Shared agents can be routed directly for data science and analytics requests"
  keywords:
    - data science
    - machine learning
    - ML
    - analytics
    - business intelligence
    - BI
    - visualization
    - dataset
    - statistical modeling  # cross-domain: "statistics" alone routes to science/
    - modeling
    - prediction
    - NLP
    - natural language processing
    - computer vision
    - A/B test
    - A/B experiment  # cross-domain: "experiment" alone routes to science/; use "A/B test" for shared/
    - ETL
    - data pipeline
    - dashboard
    - regression
    - classification
    - forecasting model
    - predictive
    - market research
    - competitive intelligence
